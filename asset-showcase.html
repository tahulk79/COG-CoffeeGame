<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gedeo asset showcase</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#b9cfe0;font-family:system-ui,sans-serif}
      canvas{display:block;width:100%;height:100%;touch-action:none}
      #hud{position:fixed;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
      #hud button{pointer-events:auto;border:0;border-radius:10px;padding:8px 10px;background:#fffbf0e6;color:#3b2a1a;font:600 13px system-ui;box-shadow:0 2px 6px #0003}
      #hud button.on{background:#4f7d2b;color:#fff}
      #stats{position:fixed;left:8px;bottom:8px;padding:6px 8px;border-radius:8px;background:#000a;color:#e8f5d0;font:12px/1.35 ui-monospace,monospace;white-space:pre}
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <pre id="stats">loading…</pre>
    <script type="module" src="/src/dev/asset-showcase.js"></script>
  </body>
