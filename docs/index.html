 if(phase==='complete')body=`<div class="shift-keepsake"><span aria-hidden="true">✦</span><h4>${tx('Khoảnh khắc: Dừng để khám phá','Moment: Pause to discover')}</h4><p>180 ml ${tx('nước','water')} · ${tx('Cỡ xay','Grind')} A ${progress.a.recipe.grind} → B ${progress.b.recipe.grind} · ${pauseText(progress.a.practice.pauses)}</p><p>${tx('Thẻ kỷ niệm thao tác trong game, không phải chứng nhận kỹ năng hay chất lượng cà phê.','A keepsake of your game practice, not a brewing qualification or coffee quality certificate.')}</p></div><div class="actions"><button type="button" id="shift-view-pair">${tx('Xem lại hai ly','Revisit the two cups')}</button><button type="button" id="shift-real-brew" class="secondary">${tx('Thử ghi một lượt pha thật','Try logging a real brew')}</button><button type="button" id="shift-restart" class="secondary">${tx('Chơi ca mới · giữ ký ức','New shift · keep memories')}</button></div><details class="shift-feedback"><summary>${tx('Ca này có thú vị không? · tùy chọn','Was this shift enjoyable? · optional')}</summary><form id="shift-feedback"><p class="help">${tx('Chỉ lưu trên trình duyệt, không tự gửi đi. Cảm nhận này không phải dữ liệu đo retention.','Saved only in this browser, never sent automatically. This feedback is not a retention measurement.')}</p><label>${tx('Mức thú vị · 1 thấp, 5 cao','Enjoyment · 1 low, 5 high')}<select name="fun"><option value="">${tx('Chưa đánh giá','Not rated')}</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${feedback.fun===n?'selected':''}>${n}</option>`).join('')}</select></label><label>${tx('Bạn có muốn quay lại chơi?','Would you like to return?')}<select name="returnIntent"><option value="">${tx('Chưa trả lời','Not answered')}</option>${['yes','maybe','no'].map((v,i)=>`<option value="${v}" ${feedback.returnIntent===v?'selected':''}>${[tx('Có','Yes'),tx('Có thể','Maybe'),tx('Chưa muốn','Not yet')][i]}</option>`).join('')}</select></label><label>${tx('Điều vui / điều vướng nhất','Most enjoyable / most awkward moment')}<textarea name="note" rows="2" maxlength="1000">${escape(feedback.note)}</textarea></label><button type="submit">${tx('Lưu cảm nhận về ca','Save shift feedback')}</button></form></details>`;
 return `<section class="first-shift" aria-labelledby="shift-title"><div class="shift-story"><div class="shift-portrait">${portrait}</div><div><span class="eyebrow">${tx('MAI · KHÁCH QUEN','MAI · YOUR REGULAR')}</span><h3 id="shift-title" tabindex="-1">${tx('Ca đầu tiên','Your first shift')}</h3><p>${speech}</p></div></div>${phase!=='welcome'?`<ol class="shift-path" aria-label="${tx('Tiến độ ca','Shift progress')}">${[tx('Dừng','Pause'),tx('Thử','Try'),tx('Nhận ra','Notice')].map((name,i)=>`<li ${i<progress.completed?'data-complete="true"':''}>${i<progress.completed?'✓ ':''}${i+1}. ${name}</li>`).join('')}</ol>`:''}${body}<p id="shift-notice" role="status">${escape(notice)}</p>${!writable?`<p class="warning">${tx('Tiến độ ca chưa đọc được; không ghi đè. Bạn vẫn pha tự do được.','Shift progress cannot be read and will not be overwritten. Free brewing still works.')}</p>${raw!==undefined?`<button type="button" id="shift-recovery" class="secondary">${tx('Tải tiến độ gốc','Download original progress')}</button>`:''}`:''}${pending?`<button type="button" id="shift-save-retry">${tx('Thử lưu tiến độ ca lại','Retry shift save')}</button>`:''}${session||pending?`<button type="button" id="shift-export" class="shift-export secondary">${tx('Xuất ca & các lần thử JSON','Export shift & its attempts JSON')}</button>`:''}</section>`;
}

function mountFirstPour(initialLanguage='vi'){
 const root=document.createElement('section');root.id='first-pour';root.className='first-pour-wrap';root.hidden=true;document.querySelector('#cafe').after(root);
 let dailyPracticeTitle='';
 let scaleElapsed=0,scaleStarted=false;
 let collected=0,experiment=null,experimentField='grind',search='',manualPauses=0,flowStartWater=0,activeShiftRole=null;
 let shiftLoaded;try{shiftLoaded=loadFirstShift(localStorage.getItem(firstShiftKey));}catch{shiftLoaded={session:null,writable:false};}
 let shiftSession=shiftLoaded.session,shiftFeedback=structuredClone(shiftSession?.feedback||emptyShiftFeedback()),shiftNotice='',pendingShift=null;
 let lang=initialLanguage,recipe={bean:'ethiopia',...firstPourBeans[0].target},state=null,screen='setup',held=false,toggled=false,frame=0,last=null,draft=null,saved=false,notice='',deleteId=null,compareA=null,compareB=null;
 let store;try{store=loadFirstMemories(localStorage.getItem(firstPourKey));}catch{store={records:[],writable:false};}
 let records=store.records;
 const tx=(vi,en)=>lang==='vi'?vi:en;
 const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const label=key=>({referenceId:tx('Nguồn & mốc rót','Source & pour targets'),dose:tx('Cà phê (g)','Coffee (g)'),ratio:tx('Tỷ lệ nước / cà phê','Water / coffee ratio'),grind:tx('Cỡ xay · thang trò chơi','Grind · game scale'),temp:tx('Nước (°C)','Water (°C)'),time:tx('Thời gian công thức (giây)','Recipe time (seconds)'),bean:tx('Hạt','Bean'),aroma:tx('Hương thơm','Aroma'),acidity:tx('Độ chua','Acidity'),sweetness:tx('Độ ngọt','Sweetness'),bitterness:tx('Độ đắng','Bitterness'),body:tx('Thể chất','Body'),aftertaste:tx('Hậu vị','Aftertaste')}[key]);
 const stages=()=>[tx('Ủ nở · bloom','Bloom'),tx('Rót chính','Main pour'),tx('Rót cuối','Final pour')];
 const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`;
 const scoreText=result=>result.score===null?tx('Chưa có mốc điểm','No game benchmark'):`${result.score}/100`;
 const beanName=id=>firstPourBeans.find(b=>b.id===id)?.name||id;
 const emptyFeedback=()=>({context:'reflection',notes:'',nextChange:'',enjoyment:null,axes:Object.fromEntries(firstPourAxes.map(k=>[k,null]))});
 function download(value,name,raw=false){const url=URL.createObjectURL(new Blob([raw?value:JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function stop(){held=false;toggled=false;}
 function capture(){
  captureShiftFeedback();const form=root.querySelector('#fp-recipe');
  if(form)recipe={...(recipe.referenceId?{referenceId:recipe.referenceId}:{}),bean:form.elements.bean.value,...Object.fromEntries(Object.keys(firstPourLimits).map(k=>[k,Number(form.elements[k].value)]))};
  const feedback=root.querySelector('#fp-feedback');
  if(feedback&&draft)draft={...draft,feedback:{context:feedback.elements.context.value,notes:feedback.elements.notes.value,nextChange:feedback.elements.nextChange.value,enjoyment:feedback.elements.enjoyment.value?Number(feedback.elements.enjoyment.value):null,axes:Object.fromEntries(firstPourAxes.map(k=>[k,feedback.elements[k].value?Number(feedback.elements[k].value):null]))}};
 }

 function persist(next){if(!store.writable){notice=tx('Dữ liệu cũ chưa đọc được. Hãy tải bản gốc để phục hồi; không ghi đè.','Existing data could not be read. Download the original for recovery; it will not be overwritten.');return false;}try{localStorage.setItem(firstPourKey,JSON.stringify({version:1,records:next}));records=next;notice=tx('Đã lưu trên trình duyệt này.','Saved in this browser.');return true;}catch{notice=tx('Chưa lưu được. Hãy thử lại hoặc tải bản nháp; tiến độ cũ vẫn giữ nguyên.','Could not save. Retry or download the draft; previous records are preserved.');return false;}}
 function configure(){return `${recipe.referenceId?renderRecipeReference(recipe.referenceId,lang,recipe):`<details class="fp-reference-book"><summary>${tx('Công thức có xuất xứ · James Hoffmann','Attributed recipe · James Hoffmann')}</summary>${renderRecipeBook(lang)}</details><p class="help recipe-origin">${tx('Công thức hiện tại: mẫu do game thiết kế, chưa gắn nguồn barista.','Current recipe: a game-authored example without barista attribution.')}</p>`}${dailyPracticeTitle?`<p class="daily-practice-note">${tx('Từ sổ quán','From the café notebook')}: <strong>${escape(dailyPracticeTitle)}</strong> · ${tx('Công thức minh họa, không dự đoán vị thật.','Illustrative recipe, not a real flavor prediction.')}</p>`:''}${experimentSetup()}<form id="fp-recipe" class="${experiment?'fp-guided-recipe':''}"><label ${experiment?'hidden':''}>${label('bean')}<select name="bean" ${experiment?'disabled':''}>${firstPourBeans.map(b=>`<option value="${b.id}" ${b.id===recipe.bean?'selected':''}>${b.name}</option>`).join('')}</select></label><p class="help" ${experiment?'hidden':''}>${tx('Các lô hạt minh họa, không đại diện mọi cà phê cùng xuất xứ hoặc sơ chế.','Illustrative lots, not representative of all coffee with the same origin or process.')}</p><div class="fields">${Object.entries(firstPourLimits).map(([key,[min,max]])=>`<label ${experiment&&key!==experimentField?'hidden':''}>${label(key)}<input name="${key}" type="number" inputmode="decimal" required ${experiment&&key!==experimentField?'disabled':''} min="${min}" max="${max}" step="${key==='ratio'&&recipe.referenceId?'any':['dose','ratio'].includes(key)?'.1':'1'}" value="${recipe[key]}"></label>`).join('')}</div><p id="fp-target">${tx('Nước mục tiêu','Target water')}: ${validFirstRecipe(recipe)?firstPourPlan(recipe)[2]:'—'} ml · 1:${recipe.ratio}</p><p class="help">${tx('Thời gian ở trên là đầu vào công thức trong mô hình; thời gian bạn chơi được ghi riêng và không phải thời gian pha ngoài đời.','Recipe time above is a model input; your play time is recorded separately and is not real brewing time.')}</p><div class="actions"><button type="submit" id="fp-start">${experiment?tx('Pha ly B · một biến mới','Brew B · one change'):tx('Bắt đầu ba nhịp rót','Start three-stage pour')}</button><button type="button" id="fp-preset" class="secondary" ${experiment?'disabled hidden':''}>${tx('Dùng công thức khởi hành','Use a starting recipe')}</button></div></form>`;}
 function stageTip(){return [tx('Làm ướt đều bột cà phê. Thả nút bất cứ lúc nào để quan sát.','Wet the grounds evenly. Release at any time to observe.'),tx('Rót nhẹ và đều. Game sẽ tự dừng khi đủ nước cho nhịp này.','Pour gently and evenly. The game stops at this stage’s target.'),tx('Hoàn thành lượng nước còn lại, rồi chờ giọt cà phê cuối.','Finish the remaining water, then watch the last coffee drops.')][state.stage];}
 function stageStatus(){return state.done?tx('Đủ nước · đang chờ giọt cuối…','Water complete · waiting for the last drops…'):state.ready?tx('Đã đủ nhịp này · bấm “Sang nhịp” khi sẵn sàng.','Stage complete · continue when you are ready.'):tx('Giữ nút để rót, hoặc bật rót tự động.','Hold to pour, or switch on automatic pouring.');}
 function nextLabel(){return state.done?tx('Đang chờ giọt cuối','Waiting for final drops'):state.stage===2?tx('Nhịp cuối','Final stage'):tx('Sang nhịp ','Continue to stage ')+(state.stage+2);}
 function brewScale(){return `<div class="fp-scale" role="group" aria-label="${tx('Cân cà phê điện tử mô phỏng','Simulated digital coffee scale')}" aria-describedby="fp-scale-note"><div class="fp-scale-platform" aria-hidden="true"></div><div class="fp-scale-brand"><span>C6S · BREW SCALE</span><span>${tx('TỰ TRỪ BÌ','AUTO TARE')} · 0</span></div><div class="fp-scale-screen"><div class="fp-scale-time"><small>${tx('THỜI GIAN LƯỢT','BREW TIME')}</small><b id="fp-scale-clock">${clock(scaleElapsed)}</b></div><div class="fp-scale-mass"><small>${tx('NƯỚC ĐÃ RÓT','WATER POURED')}</small><div><b id="fp-water">${Math.round(state.water)}</b><span>g*</span></div></div></div><div class="fp-scale-indicators"><span><i id="fp-scale-led" aria-hidden="true"></i><span id="fp-scale-state">${tx('Sẵn sàng','Ready')}</span></span><span>${tx('Mốc','Target')}: <b id="fp-scale-target">${state.plan[state.stage]}</b> g*</span></div></div><div class="fp-scale-detail"><span>${tx('Thời gian rót','Pour time')}: <b id="fp-clock">${clock(state.seconds)}</b></span><span>${tx('Tự ngừng rót','Manual pauses')}: <b id="fp-pauses">${manualPauses}</b></span></div><p id="fp-scale-note" class="help">${tx('g* là gam quy ước của game; thời gian pha đã rút ngắn.','g* is a game mass unit; brewing time is shortened.')}</p>`;}
 function pour(){const plan=state.plan;return `<div class="fp-workspace" id="fp-workspace" tabindex="-1" aria-label="${tx('Bàn rót ba nhịp','Three-stage pouring station')}"><ol class="fp-stages">${stages().map((name,i)=>`<li ${i===state.stage?'aria-current="step"':''}>${i+1}. ${name}<small>${plan[i]-(plan[i-1]||0)} ml</small></li>`).join('')}</ol><div class="fp-stage-info"><h3 id="fp-stage-title">${stages()[state.stage]}</h3><p id="fp-stage-tip">${stageTip()}</p></div><div class="fp-visual"><div class="fp-station"><div class="fp-shelf" aria-hidden="true"></div><div class="brew-apparatus" aria-hidden="true">${brewEquipment('first')}</div><div class="fp-table" aria-hidden="true"></div>${brewScale()}</div><progress id="fp-progress" max="${plan[2]}" value="${state.water}" aria-label="${tx('Tổng lượng nước đã rót','Total water poured')}"></progress></div><div class="fp-controls"><p id="fp-stage-status" role="status" tabindex="-1">${stageStatus()}</p><button type="button" class="hold-pour" id="fp-hold" ${state.ready?'disabled':''}>${tx('Nhấn giữ để rót','Hold to pour')}</button><div class="fp-control-row"><button type="button" class="secondary" id="fp-toggle" aria-pressed="false" ${state.ready?'disabled':''}>${tx('Rót tự động','Auto pour')}</button><button type="button" id="fp-next" ${!state.ready||state.done?'disabled':''}>${nextLabel()}</button></div></div></div><details class="fp-howto"><summary>${tx('Cách chơi & giới hạn mô phỏng','Controls & simulation limits')}</summary><p class="help">${tx('Giữ Space/Enter trên nút rót, hoặc dùng “Rót tự động” để không cần nhấn giữ. Mỗi nhịp tự dừng ở mốc nước. Trong pha thật, bloom giúp khí thoát ra; thời gian cần tùy cà phê. Nhịp rót và đoạn chờ được rút ngắn. Cân quy ước 1 ml nước trong mô hình = 1 g*, không phải phép đổi khối lượng vật lý. Cân đã trừ bì cả bộ pha và bột, hiển thị tổng nước rót, không phải lượng cà phê thu được. Đồng hồ lượt bắt đầu từ giọt đầu, chạy cả khi chờ; đồng hồ rót chỉ tính lúc cấp nước. Ẩn tab hoặc mở hộp giữ/thay ly sẽ tạm dừng diễn tiến. Đây không phải mô phỏng chiết xuất hoặc thời gian pha thật.','Hold Space/Enter on the pour button, or use Auto pour for hold-free control. Each stage stops at its water target. In real brewing, blooming lets gas escape; timing depends on the coffee. Pouring and waiting are shortened. The scale assigns 1 game ml of water = 1 g*, not a physical mass conversion. The whole setup and grounds are tared; the scale shows cumulative water, not beverage yield. Brew time starts at first water and includes waiting; pour time only counts water delivery. Hiding the tab or opening the keep/replace dialog suspends progression. This does not simulate extraction or real brew time.')}</p></details><button id="fp-reset" type="button" class="secondary">${tx('Pha lại từ đầu','Restart this cup')}</button>`;}

 function selectRating(name,value,title){return `<label>${title}<select name="${name}"><option value="">${tx('Chưa đánh giá','Not rated')}</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${value===n?'selected':''}>${n}</option>`).join('')}</select></label>`;}
 function outcome(){const score=draft.result,feedback=draft.feedback;return `${draft.recipe.referenceId?renderRecipeReference(draft.recipe.referenceId,lang,draft.recipe):''}<h3 tabindex="-1" id="fp-result-title">${tx('Ba nhịp rót đã hoàn thành','Three stages complete')} ☕</h3><p class="practice-receipt">${tx('Lần tự dừng giữa nhịp','Deliberate mid-stage pauses')}: <strong>${draft.practice?.pauses??'—'}</strong>. ${tx('Tách riêng với điểm công thức và hương vị.','Separate from recipe score and flavor.')}</p>${experimentOutcome()}<p>${draft.pour.water} ml · ${tx('Thời gian thao tác','Active play time')} ${clock(draft.pour.playSeconds)}</p><div class="fp-score"><strong>${score.score===null?'—':`${score.score}/100`}</strong><span>${score.score===null?(draft.recipe.referenceId?tx('Công thức tham khảo · không chấm vị','Reference recipe · no taste score'):tx('Lô khám phá · chưa có mốc điểm','Discovery lot · no game benchmark')):tx('Mức khớp mốc công thức trong game','Match to the game recipe preset')}</span></div><p>${score.score===null?tx('Lượt này chưa có mốc chấm điểm. Hãy lưu công thức và cảm nhận của bạn; game không suy ra hương vị từ tên hạt.','This brew has no game benchmark. Save your recipe and impressions; the bean name does not predict flavor.'):score.matched?tx('Bạn khớp mốc minh họa của lô này. Thử đổi một biến rồi so sánh hai ký ức.','You matched this lot’s game preset. Try changing one variable and compare the memories.'):tx('Biến lệch nhiều nhất theo trọng số game: ','Largest weighted difference in the game: ')+label(score.largest)+'. '+tx('Thử đổi riêng biến này, giữ các biến còn lại.','Try changing only this variable and keeping the others fixed.')}</p><p class="help">${tx('Điểm chỉ so công thức với mốc được thiết kế cho trò chơi; nhịp chạm không đổi điểm. Không phải TDS, hiệu suất chiết xuất hay điểm hương vị thật.','The score only compares the recipe to a designed game preset; tap rhythm does not change it. It is not TDS, extraction yield, or real taste quality.')} ${escape(score.modelVersion)}</p><form id="fp-feedback"><h4>${tx('Coffee Memory · cảm nhận của bạn','Coffee Memory · your experience')}</h4><label>${tx('Ngữ cảnh của ghi chú','Context for your notes')}<select name="context"><option value="reflection" ${feedback.context==='reflection'?'selected':''}>${tx('Suy ngẫm / tưởng tượng khi chơi','Reflection / imagination while playing')}</option><option value="self-reported-real-tasting" ${feedback.context==='self-reported-real-tasting'?'selected':''}>${tx('Tôi tự báo đã nếm một ly thật riêng','I report tasting a separate real cup')}</option></select></label><p class="help">${tx('Tất cả thang cảm quan dưới đây do bạn nhập, không do mô hình dự đoán. Tự báo nếm thật không xác minh công thức hay phép đo. Dùng “Ghi lượt pha thật” cho hồ sơ thực nghiệm.','Every sensory rating below is your own input, not a model prediction. A self-reported real tasting does not verify a recipe or measurement. Use “Record a real brew” for experimental records.')}</p><details><summary>${tx('Sáu thuộc tính cảm quan · tùy chọn','Six sensory attributes · optional')}</summary><p class="help">${tx('Cường độ 1–5: 1 rất thấp, 5 rất cao; cao hơn không có nghĩa ngon hơn.','Intensity 1–5: 1 very low, 5 very high; higher does not mean better.')}</p><div class="fields">${firstPourAxes.map(k=>selectRating(k,feedback.axes[k],label(k))).join('')}</div></details><details class="fp-sensory-map"><summary>${tx('Xem bản đồ cảm nhận','View sensory map')}</summary><div id="fp-radar">${firstSensoryRadar(lang,[{label:tx('Ly này','This cup'),feedback}])}</div></details>${selectRating('enjoyment',feedback.enjoyment,tx('Mức yêu thích cá nhân · 1–5 (tùy chọn)','Personal enjoyment · 1–5 (optional)'))}<label>${tx('Ghi chú / khoảnh khắc của bạn','Your notes / moment')}<textarea name="notes" rows="3" maxlength="1000">${escape(feedback.notes)}</textarea></label><label>${tx('Lần sau tôi muốn đổi điều gì?','What would I change next time?')}<textarea name="nextChange" rows="2" maxlength="1000">${escape(feedback.nextChange)}</textarea></label><div class="actions"><button type="submit" id="fp-save">${saved?tx('Cập nhật ký ức này','Update this memory'):tx('Lưu Coffee Memory','Save Coffee Memory')}</button><button type="button" class="secondary" id="fp-draft-export">${tx('Tải bản nháp JSON','Download draft JSON')}</button><button type="button" class="secondary" id="fp-retry">${tx('Chỉnh một biến & thử lại','Change one variable & retry')}</button></div></form>`;}
 function memory(){return `<details class="fp-memory" ${records.length?'open':''}><summary>Coffee Memory · ${records.length} ${tx('lần pha ba nhịp','three-stage brews')}</summary><p class="help">${tx('Lưu riêng trong trình duyệt này, không có tài khoản hay đồng bộ. Xóa dữ liệu trình duyệt, đổi thiết bị hoặc dùng chế độ riêng tư có thể làm mất ký ức. Xuất JSON để giữ bản sao. Nhật ký cũ và lượt pha thật vẫn ở mục riêng.','Stored only in this browser, without accounts or sync. Clearing browser data, changing devices, or private browsing may lose memories. Export JSON for backup. Older journals and real brews remain in their own sections.')}</p><button type="button" id="fp-export" class="secondary">${tx('Xuất Coffee Memory JSON','Export Coffee Memory JSON')}</button>${!store.writable?`<p class="warning">${tx('Dữ liệu chưa đọc được; ghi/xóa bị khóa để bảo vệ bản gốc.','Data could not be read; saving/deleting is locked to protect the original.')}</p>${store.raw!==undefined?`<button type="button" id="fp-recovery">${tx('Tải dữ liệu gốc','Download original data')}</button>`:''}`:''}${records.length>1?`<details class="fp-compare"><summary>${tx('So sánh hai ký ức & bản đồ cảm nhận','Compare two memories & sensory maps')}</summary><div class="fields">${['a','b'].map((key,i)=>`<label>${tx('Lần pha','Brew')} ${key.toUpperCase()}<select id="fp-compare-${key}">${records.map((r,index)=>`<option value="${escape(r.id)}" ${r.id===(i?compareB:compareA)?'selected':''}>#${index+1} · ${beanName(r.recipe.bean)}</option>`).join('')}</select></label>`).join('')}</div><div id="fp-comparison"></div></details>`:''}<label class="fp-search">${tx('Tìm ký ức theo hạt hoặc ghi chú','Find memories by bean or notes')}<input id="fp-search" type="search" value="${escape(search)}" placeholder="${tx('Ví dụ: Ethiopia, hương hoa…','For example: Ethiopia, floral…')}"/></label><p id="fp-search-count" class="help" role="status"></p><div class="fp-history">${records.length?records.slice().reverse().map(r=>`<article data-memory-id="${escape(r.id)}"><strong>${beanName(r.recipe.bean)} · ${scoreText(r.result)} ${tx('(game)','(game)')}</strong><small>${escape(new Date(r.date).toLocaleString(lang==='vi'?'vi-VN':'en-GB'))}</small><p class="help memory-recipe-origin">${r.recipe.referenceId?`${recipeReference(r.recipe.referenceId).author} · ${recipeReference(r.recipe.referenceId).title} · ${tx('bản luyện có điều chỉnh','adapted practice')}`:tx('Mẫu do game thiết kế · chưa gắn nguồn barista','Game-authored example · no barista attribution')}</p><p>${Object.keys(firstPourLimits).map(k=>`${label(k)}: ${r.recipe[k]}`).join(' · ')}</p><p>${tx('Ghi chú','Notes')}: ${escape(r.feedback.notes||'—')}</p><p>${tx('Lần sau','Next time')}: ${escape(r.feedback.nextChange||'—')}</p><p class="help">${r.feedback.context==='reflection'?tx('Suy ngẫm trong game','Game reflection'):tx('Tự báo nếm một ly thật riêng · chưa xác minh','Self-reported separate real tasting · unverified')} · ${tx('Yêu thích','Enjoyment')}: ${r.feedback.enjoyment??'—'}/5</p><p class="help">${firstPourAxes.map(k=>`${label(k)}: ${r.feedback.axes[k]??'—'}`).join(' · ')}</p><div class="actions memory-brew-actions"><button type="button" class="secondary" data-rebrew="${escape(r.id)}">${tx('Pha lại công thức','Brew this recipe')}</button><button type="button" data-experiment="${escape(r.id)}">${tx('Thử đổi một biến','Try one change')}</button></div>${r.baselineId?`<p class="help">${firstExperimentPair(records,r).status==='one-change'?tx('✓ Cặp A/B một biến đã lưu','✓ Saved one-change A/B pair'):firstExperimentPair(records,r).status==='missing-baseline'?tx('Ly A đã bị xóa; giữ ly B và ghi chú của bạn.','Cup A was deleted; cup B and your notes remain.'):tx('Liên kết so sánh: công thức không còn là một biến.','Comparison link: recipes are not a one-change pair.')}</p>`:''}${deleteId===r.id?`<p>${tx('Xóa ký ức này khỏi trình duyệt?','Delete this memory from the browser?')}</p><button type="button" data-confirm-delete="${escape(r.id)}">${tx('Xác nhận xóa','Confirm delete')}</button><button type="button" id="fp-cancel-delete" class="secondary">${tx('Giữ lại','Keep it')}</button>`:`<button type="button" class="secondary" data-delete="${escape(r.id)}" ${store.writable?'':'disabled'}>${tx('Xóa ký ức này','Delete this memory')}</button>`}</article>`).join(''):`<p>${tx('Chưa có ký ức. Hoàn thành ba nhịp rồi lưu ly đầu tiên.','No memories yet. Complete three stages and save your first cup.')}</p>`}</div></details>`;}
 function compare(){const target=root.querySelector('#fp-comparison');if(!target)return;compareA=root.querySelector('#fp-compare-a').value;compareB=root.querySelector('#fp-compare-b').value;const a=records.find(r=>r.id===compareA),b=records.find(r=>r.id===compareB);if(!a||!b||a.id===b.id){target.textContent=tx('Chọn hai ký ức khác nhau.','Choose two different memories.');return;}const changed=compareFirstMemories(a,b);target.innerHTML=`<p>${tx('Biến đã đổi','Changed variables')}: ${changed.length?changed.map(label).join(', '):tx('không có','none')}. ${changed.length>1?tx('Nhiều biến cùng đổi: không thể quy khác biệt cho một biến riêng.','Multiple variables changed: the difference cannot be attributed to one variable.'):tx('So sánh này để quan sát, không chứng minh quan hệ nhân quả ngoài đời.','This comparison supports observation, not proof of real-world causation.')}</p><div class="fp-table-scroll"><table><caption>${tx('Công thức và cảm nhận · A / B','Recipe and experience · A / B')}</caption><thead><tr><th>${tx('Thuộc tính','Attribute')}</th><th>A</th><th>B</th></tr></thead><tbody>${['bean',...Object.keys(firstPourLimits),'referenceId','score',...firstPourAxes,'enjoyment','notes','nextChange','context'].map(k=>`<tr><th scope="row">${label(k)||({score:tx('Điểm game','Game score'),enjoyment:tx('Yêu thích · 1–5','Enjoyment · 1–5'),notes:tx('Ghi chú','Notes'),nextChange:tx('Lần sau','Next time'),context:tx('Ngữ cảnh','Context')}[k])}</th>${[a,b].map(r=>{let value=k==='referenceId'?(recipeReference(r.recipe.referenceId)?recipeReference(r.recipe.referenceId).author+' · '+recipeReference(r.recipe.referenceId).title:tx('Mẫu của game','Game example')):k==='bean'?beanName(r.recipe.bean):k==='score'?r.result.score:firstPourAxes.includes(k)?r.feedback.axes[k]:k==='context'?(r.feedback.context==='reflection'?tx('Suy ngẫm game','Game reflection'):tx('Tự báo nếm thật · chưa xác minh','Self-reported real tasting · unverified')):r.recipe[k]??r.feedback[k];return `<td>${escape(value??'—')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>${firstSensoryRadar(lang,[{label:'A',feedback:a.feedback},{label:'B',feedback:b.feedback}])}`;}
 function experimentSetup(){
  if(!experiment)return `<aside class="fp-discovery-intro"><strong>${tx('Khám phá tiếp theo','Your next discovery')}</strong><p>${records.length?tx('Chọn “Thử đổi một biến” từ một ký ức để pha ly B và đối chiếu với ly A.','Choose “Try one change” on a memory to brew cup B against cup A.'):tx('Lưu ly đầu tiên làm mốc A. Sau đó đổi một biến, pha ly B và so sánh điều bạn nhận ra.','Save your first cup as baseline A. Then change one variable, brew B and compare what you notice.')}</p>${records.length?`<button type="button" id="fp-continue-last">${tx('Thử một biến từ ly đã lưu gần nhất','Try one change from your last saved cup')}</button>`:''}</aside>`;
  return `<aside class="fp-experiment"><h3>${tx('Ly B · chỉ đổi một biến','Cup B · change one variable')}</h3><p>${tx('Mốc A','Baseline A')}: ${beanName(experiment.recipe.bean)} · ${scoreText(experiment.result)} ${tx('(game)','(game)')}</p><label>${tx('Biến tôi muốn thử','Variable to explore')}<select id="fp-experiment-field" ${activeShiftRole==='b'?'disabled':''}>${firstExperimentFields.map(k=>`<option value="${k}" ${k===experimentField?'selected':''}>${label(k)}</option>`).join('')}</select></label><p>${tx('Các ô khác giữ nguyên để dễ đối chiếu. Giá trị mốc','Other fields stay fixed for comparison. Baseline value')}: <strong>${experiment.recipe[experimentField]}</strong>.</p><details class="fp-fixed-recipe"><summary>${tx('Xem thông số giữ nguyên','View fixed recipe settings')}</summary><dl>${['bean',...Object.keys(firstPourLimits)].filter(k=>k!==experimentField).map(k=>`<div><dt>${label(k)}</dt><dd>${k==='bean'?beanName(experiment.recipe.bean):experiment.recipe[k]}</dd></div>`).join('')}</dl></details><button type="button" id="fp-cancel-experiment" class="secondary">${tx('Về pha tự do','Return to free brewing')}</button></aside>`;
 }
 function experimentOutcome(){
  if(!draft?.baselineId)return '';
  const pair=firstExperimentPair(records,draft);
  if(pair.status==='missing-baseline')return `<aside class="fp-experiment"><p>${tx('Ly A đã bị xóa. Bạn vẫn có thể lưu ly B; không còn đủ hai ly để đối chiếu.','Cup A was deleted. You can still save B, but the pair is no longer available for comparison.')}</p></aside>`;
  const a=pair.baseline;
  return `<aside class="fp-experiment"><h4>${tx('Bạn vừa thử một thay đổi','You tried one change')}</h4><p>${pair.changed.map(k=>`${label(k)}: ${a.recipe[k]} → ${draft.recipe[k]}`).join(' · ')}</p><p>${tx('Điểm công thức trong game','Game recipe score')}: A ${a.result.score??'—'} → B ${draft.result.score??'—'}. ${tx('Đây là phản hồi quy tắc game; không kết luận ly nào ngon hơn ngoài đời.','This reflects the game rules, not which real cup tastes better.')}</p><p>${tx('Ghi điều bạn nhận ra và dự định thử tiếp. Lưu ly B để mở so sánh A/B ngay bên dưới.','Record what you noticed and what to try next. Save B to open its A/B comparison below.')}</p>${saved?`<button type="button" id="fp-view-pair" class="secondary">${tx('Xem cặp A/B đã lưu','View saved A/B pair')}</button>`:''}</aside>`;
 }
 function fromMemory(id,asExperiment,shiftRole=null){
  const source=records.find(r=>r.id===id);if(!source)return;
  stop();cancelAnimationFrame(frame);activeShiftRole=shiftRole;dailyPracticeTitle='';experiment=asExperiment?structuredClone(source):null;experimentField='grind';recipe={...source.recipe};if(shiftRole==='b')recipe.grind=source.recipe.grind<40?source.recipe.grind+1:source.recipe.grind-1;state=null;screen='setup';collected=0;draft=null;saved=false;notice='';
  root.querySelector('#fp-game')?.replaceChildren();render();focus(asExperiment?'#fp-experiment-field':'#fp-start');
 }
 function filterMemory(){let count=0;root.querySelectorAll('[data-memory-id]').forEach(el=>{const entry=records.find(r=>r.id===el.dataset.memoryId);el.hidden=!firstMemoryMatches(entry,search);if(!el.hidden)count++;});root.querySelector('#fp-search-count').textContent=`${count} / ${records.length} `+tx('ký ức phù hợp','matching memories');}
 function bindDiscovery(){
  root.querySelector('#fp-continue-last')?.addEventListener('click',()=>fromMemory(records.at(-1).id,true));
  root.querySelector('#fp-search').oninput=e=>{search=e.target.value;filterMemory();};filterMemory();
  root.querySelectorAll('[data-rebrew]').forEach(button=>button.onclick=()=>fromMemory(button.dataset.rebrew,false));
  root.querySelectorAll('[data-experiment]').forEach(button=>button.onclick=()=>fromMemory(button.dataset.experiment,true));
  root.querySelector('#fp-experiment-field')?.addEventListener('change',e=>{experimentField=e.target.value;recipe={...experiment.recipe};root.querySelector('#fp-recipe')?.remove();render();root.querySelector(`[name="${experimentField}"]`).focus({preventScroll:true});});
  root.querySelector('#fp-cancel-experiment')?.addEventListener('click',()=>{capture();experiment=null;activeShiftRole=null;root.querySelector('#fp-recipe')?.remove();render();});
  root.querySelector('#fp-view-pair')?.addEventListener('click',()=>{compareA=draft.baselineId;compareB=draft.id;compare();root.querySelector('.fp-memory').open=true;root.querySelector('.fp-compare').open=true;root.querySelector('.fp-compare').scrollIntoView({behavior:'smooth',block:'start'});});
 }

 function captureShiftFeedback(){const form=root.querySelector('#shift-feedback');if(form)shiftFeedback={fun:form.elements.fun.value?Number(form.elements.fun.value):null,returnIntent:form.elements.returnIntent.value||null,note:form.elements.note.value};}
 function shiftMarkup(){return firstShiftPanel({language:lang,session:shiftSession,records,writable:shiftLoaded.writable,raw:shiftLoaded.raw,notice:shiftNotice,pending:Boolean(pendingShift),feedback:shiftFeedback});}
 function writeShift(next){
  if(!shiftLoaded.writable){shiftNotice=tx('Không ghi đè tiến độ ca chưa đọc được.','Unreadable shift progress will not be overwritten.');return false;}
  try{localStorage.setItem(firstShiftKey,JSON.stringify(next));shiftSession=next;pendingShift=null;shiftNotice=tx('Đã lưu ca trên trình duyệt này.','Shift saved in this browser.');return true;}catch{pendingShift=next;shiftNotice=tx('Chưa lưu được tiến độ ca. Ký ức đã lưu vẫn giữ nguyên; thử lưu lại hoặc xuất ca.','Shift progress could not be saved. Saved memories remain intact; retry or export the shift.');return false;}
 }
 function startShiftA(){
  stop();cancelAnimationFrame(frame);activeShiftRole='a';dailyPracticeTitle='';experiment=null;draft=null;screen='setup';state=null;recipe={bean:'brazil',...firstPourBeans.find(b=>b.id==='brazil').target,dose:12,ratio:15};
  root.querySelector('#fp-game')?.replaceChildren();render();root.querySelector('#fp-recipe').requestSubmit();
 }
 function bindShift(){
  const start=()=>{captureShiftFeedback();const next=createFirstShift(crypto.randomUUID());if(writeShift(next)){shiftFeedback=emptyShiftFeedback();root.querySelector('#shift-panel')?.replaceChildren();startShiftA();}else render();};
  root.querySelector('#shift-start')?.addEventListener('click',start);root.querySelector('#shift-restart')?.addEventListener('click',start);
  root.querySelector('#shift-brew-a')?.addEventListener('click',startShiftA);
  root.querySelector('#shift-brew-b')?.addEventListener('click',()=>{const goal=firstShiftProgress(shiftSession,records);if(goal.a)fromMemory(goal.a.id,true,'b');});
  root.querySelectorAll('[data-shift-answer]').forEach(button=>button.onclick=()=>{captureShiftFeedback();const committed=writeShift(answerFirstShift(shiftSession,records,button.dataset.shiftAnswer));render();if(committed&&firstShiftProgress(shiftSession,records).phase==='complete')focus('#shift-title');else root.querySelector('#shift-title')?.focus({preventScroll:true});});
  root.querySelector('#shift-view-pair')?.addEventListener('click',()=>{const goal=firstShiftProgress(shiftSession,records);if(!goal.a||!goal.b)return;compareA=goal.a.id;compareB=goal.b.id;compare();root.querySelector('.fp-memory').open=true;root.querySelector('.fp-compare').open=true;root.querySelector('.fp-compare').scrollIntoView({behavior:'smooth',block:'start'});});
  root.querySelector('#shift-real-brew')?.addEventListener('click',()=>document.querySelector('#open-real-brew').click());
  root.querySelector('#shift-feedback')?.addEventListener('submit',e=>{e.preventDefault();captureShiftFeedback();writeShift({...shiftSession,feedback:{...shiftFeedback}});render();const details=root.querySelector('.shift-feedback');if(details)details.open=true;});
  root.querySelector('#shift-save-retry')?.addEventListener('click',()=>{const next=pendingShift;if(next)writeShift(next);render();});
  root.querySelector('#shift-recovery')?.addEventListener('click',()=>download(shiftLoaded.raw,'c6s-shift-recovery.json',true));
  root.querySelector('#shift-export')?.addEventListener('click',()=>{captureShiftFeedback();const session=pendingShift||shiftSession,goal=firstShiftProgress(session,records);download({kind:'first-shift-game-progress',version:1,session,pendingProgress:Boolean(pendingShift),unsavedFeedback:shiftFeedback,proof:{aId:goal.a?.id??null,bId:goal.b?.id??null},cups:records.filter(r=>r.shift?.id===session.id)},'c6s-first-shift.json');});
 }

 function focus(selector){root.querySelector(selector)?.focus({preventScroll:true});root.querySelector(selector)?.scrollIntoView({behavior:'smooth',block:'start'});}
 function render(){capture();if(records.length>1){if(!records.some(r=>r.id===compareA))compareA=records.at(-2).id;if(!records.some(r=>r.id===compareB))compareB=records.at(-1).id;}
 root.innerHTML=`<div class="panel fp-panel"><div class="section-head"><span class="eyebrow">v0.11.0 · YOUR FIRST SHIFT</span><button type="button" id="fp-back" class="secondary">${tx('Về quầy','Back to counter')}</button></div><h2 id="fp-title" tabindex="-1">Discover Your Sixth Taste</h2><p>${tx('Pha một ly. Đổi một biến. Tìm điều bạn muốn thử tiếp.','Brew a cup. Change one variable. Find your next discovery.')}</p><details class="fp-about"><summary>${tx('Giới thiệu & giới hạn','About & limits')}</summary><p class="help">${tx('“Sixth Taste” là ẩn dụ cho khám phá cá nhân, không phải vị cơ bản thứ sáu được khoa học xác lập. Sáu thuộc tính cảm quan là các mô tả riêng.','“Sixth Taste” is a metaphor for personal discovery, not a scientifically established sixth basic taste. The six sensory attributes are separate descriptors.')}</p></details><div id="shift-panel">${shiftMarkup()}</div><div id="fp-game">${screen==='setup'?configure():screen==='pour'?pour():outcome()}</div><p role="status" id="fp-notice">${escape(notice)}</p>${memory()}<footer>From Coffee to Consciousness</footer></div>`;
 bindRecipeReferenceButtons(root,lang);

function realAnalysis(record){

function loadRealObservations(raw){

   const normalized=realMeasurements(r);
   if(!realMeasureFields.every(f=>((f==='servingTemperature'||f==='holdingSeconds')&&!Object.hasOwn(r.measurements||{},f))||(r.measurements?.[f]?.value===normalized.measurements[f].value&&r.measurements[f].unit===normalized.measurements[f].unit&&r.measurements[f].source===normalized.measurements[f].source)))return false;
   return realSensoryFields.every(f=>r.sensory?.[f]&&(r.sensory[f].value===null?r.sensory[f].source==='missing':Number.isInteger(r.sensory[f].value)&&r.sensory[f].value>=1&&r.sensory[f].value<=5&&r.sensory[f].source==='self_reported'));

 }catch{return {records:[],writable:false,raw};}

e.'):say('Có đầu vào chưa xác định cách thu; không coi đây là kết quả từ số đo đã xác minh.','Some inputs have unclassified origins; this is not a verified measurement result.')}</p>`}<p>${say('Không chấm ngon/dở, không dự đoán chua/đắng từ hiệu suất hoặc TDS. Không có xác suất hay khoảng tin cậy đã hiệu chuẩn.','No good/bad score or acidity/bitterness prediction is made from yield or TDS. No calibrated probability or confidence interval is available.')}</p><p>${say('Số liệu còn thiếu','Missing measurements')}: ${a.missing.length?a.missing.map(measureLabel).join(' · '):say('không','none')}.</p><button id="real-new">${say('Ghi lượt pha thật mới','Record another real brew')}</button>`;}

const cafeModelVersion = 'counter-assumptions-v3';
// A fictional learning model, not a calibrated extraction or sensory predictor.
const cafeSpeed = 6;
const cafeBeans = [
 {id:'brazil',name:['Lô A · Brazil · rang vừa đậm','Lot A · Brazil · medium-dark roast'],notes:['Chocolate & hạt','Chocolate & nuts'],base:[1,2,3],extractability:1.25},
 {id:'colombia',name:['Lô B · Colombia · rang vừa','Lot B · Colombia · medium roast'],notes:['Caramel & trái cây','Caramel & fruit'],base:[3,2,3],extractability:1},
 {id:'ethiopia',name:['Lô C · Ethiopia · rang sáng','Lot C · Ethiopia · light roast'],notes:['Hoa & cam chanh','Floral & citrus'],base:[4,1,3],extractability:.9}
];
const cafeGuests = [
 {name:'An',request:['“Một ly dịu, ít chua, đậm vừa thôi nhé.”','“Something mellow, low in acidity, with a medium strength.”'],target:[1,2,3]},
 {name:'Linh',request:['“Tôi thích vị trái cây sáng, nhẹ và ít đắng.”','“I like bright fruit, a light cup and little bitterness.”'],target:[4,1,2]},
 {name:'Minh',request:['“Cho tôi ly đậm, hơi đắng, ít chua để bắt đầu ngày mới.”','“A strong, slightly bitter, low-acidity cup to start my day.”'],target:[1,3,4]}
];
function cafeStart(bean='brazil',heat=92){
 if(!cafeBeans.some(b=>b.id===bean)||![88,92,96].includes(heat))throw Error('Invalid cafe recipe');
 return {bean,heat,time:0,pourTime:0,started:false,wasPouring:false,poured:0,water:0,absorbed:0,drained:0,overflow:0,contact:0,holds:0,extracted:0,solubles:0,cupSolubles:0,lostSolubles:0,events:[],done:false};
}
function cafeTick(state,holding,seconds){
 if(!Number.isFinite(seconds)||seconds<0)throw Error('Invalid timestep');
 if(state.done||(!state.started&&!holding))return {...state};
 const s={...state,events:[...state.events]},dt=Math.min(.1,seconds);
 let added=holding?Math.min(24*dt,180-s.poured):0;
 if(holding&&180-s.poured-added<1)added=180-s.poured;
 const pouring=added>0;
 if(!s.started&&pouring){s.started=true;s.events.push({type:'start',time:0,volume:0});}
 if(pouring!==s.wasPouring){s.events.push({type:pouring?'pour':'pause',time:s.time,volume:s.poured});if(pouring)s.holds++;}
 s.wasPouring=pouring;s.time+=dt*cafeSpeed;s.pourTime+=Math.min(dt,added/24)*cafeSpeed;s.poured+=added;s.water+=added;
 // Fixed 12 g dose, 24 ml water retention. Time advances only after first water.
 const retained=Math.min(s.water,24-s.absorbed);s.absorbed+=retained;s.water-=retained;
 if(s.water>.5){
  s.contact+=dt*cafeSpeed;
  const rate=.009*cafeBeans.find(b=>b.id===s.bean).extractability*Math.exp((s.heat-92)*.035)*Math.min(1,s.water/12);
  const dissolved=(12*.28-s.extracted)*(1-Math.exp(-rate*dt*cafeSpeed));
  s.extracted+=dissolved;s.solubles+=dissolved;
 }
 const spill=Math.max(0,s.water-64);
 const lost=s.water>0?s.solubles*spill/s.water:0;
 s.overflow+=spill;s.water-=spill;s.solubles-=lost;s.lostSolubles+=lost;
 const out=Math.min(s.water,(5+s.water*.12)*dt);
 const cup=s.water>0?s.solubles*out/s.water:0;
 s.water-=out;s.drained+=out;s.solubles-=cup;s.cupSolubles+=cup;
 s.done=s.poured>=179.9&&s.water<.5;
 if(s.done)s.events.push({type:'finish',time:s.time,volume:s.poured});
 return s;
}
function cafeResult(state,guest=0){
 const b=cafeBeans.find(b=>b.id===state.bean);if(!b||!state.done||!cafeGuests[guest])throw Error('Unfinished cup');
 const yieldRatio=state.extracted/12;
 const zone=yieldRatio<.16?'low':yieldRatio>.23?'high':'balanced';
 // No empirical sensory fit: acidity and bitterness stay fictional lot attributes.
 const clamp=n=>Math.max(1,Math.min(5,Math.round(n)));
 const concentration=state.drained>0?state.cupSolubles/state.drained:0;
 const strength=concentration<.009?1:concentration<.012?2:concentration<.016?3:concentration<.019?4:5;
 const flavor=[b.base[0],b.base[1],strength];
 const distance=flavor.reduce((sum,n,i)=>sum+Math.abs(n-cafeGuests[guest].target[i]),0);
 const fit=distance<=1?'great':distance<=3?'close':'different';
 return {version:3,kind:'game_simulation',modelVersion:cafeModelVersion,evidence:{flavor:'fictional_lot_profile',physics:'uncalibrated_game_assumption',sourceReview:'reviewed_documents_not_model_validation',sourceRegisterVersion:'supplied-source-review-v2',confidence:null},bean:state.bean,heat:state.heat,flavor,guest,fit,distance,zone,time:state.time,pourTime:state.pourTime,waitTime:state.time-state.pourTime,overflow:Math.round(state.overflow),beverage:Math.round(state.drained),holds:state.holds,contact:state.contact,events:state.events};
}
function cafeAdvice(r){
 if(r.fit==='great')return 'success';
 if(r.overflow>3)return 'overflow';
 if(r.zone==='low')return r.heat<96?'low':'pulse';
 if(r.zone==='high')return r.heat>88?'high':'pulse';

}
function cafeClock(seconds){if(!Number.isFinite(seconds))return '—';const n=Math.max(0,Math.floor(seconds));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}

 function timeline(r){return `<details class="brew-timeline"><summary>${tx('Các mốc pha','Brew timeline')}</summary><ol>${(r.events||[]).map(e=>`<li><time>${cafeClock(e.time)}</time> · ${e.type==='start'?tx('Giọt nước đầu tiên','First water'):e.type==='pour'?tx('Bắt đầu rót','Pour started'):e.type==='pause'?tx('Ngừng rót / chờ nước rút','Pour stopped / draining'):tx('Nước chảy xong','Drawdown finished')} · ${Math.round(e.volume)} ml</li>`).join('')}</ol></details>`;}

dar-story notebook')}</summary>${dayVisit.markup(lang)}</details></details><details id="practice-counter" class="cafe-optional"><summary>${tx('Quầy luyện pha tự do','Free practice counter')}</summary><p class="help recipe-origin">${tx('Quầy này dùng mẫu do game thiết kế. Sổ công thức có xuất xứ nằm ở mục riêng phía trên.','This counter uses game-authored examples. Attributed recipes are in the notebook above.')}</p><div id="counter-progress">${renderProgress()}</div>${renderWelcome()}${lessonPicker()}<section class="guest-card"><span class="guest-avatar" aria-hidden="true">${cafeGuests[guest].name[0]}</span><div><small>${tx('Khách tại quầy','At the counter')} · ${guest+1}/3</small><h2>${cafeGuests[guest].name}</h2><p>${at(cafeGuests[guest].request)}</p><details><summary>${tx('Khẩu vị khách','Guest’s taste')}</summary>${meters(cafeGuests[guest].target)}</details></div></section>${saveError||!loaded.writable?`<div class="warning" role="status">${tx('Chưa lưu được tiến độ. Không cộng XP cho lượt chưa lưu; bạn có thể thử lưu lại hoặc tải bản sao.','Progress is not saved. Unsaved cups earn no XP; retry saving or download a backup.')}<div class="actions"><button id="counter-export" class="secondary">${tx('Tải bản sao','Download backup')}</button>${loaded.raw&&!loaded.writable?`<button id="counter-recovery" class="secondary">${tx('Tải dữ liệu gốc để phục hồi','Download original for recovery')}</button>`:''}</div></div>`:''}<section class="panel cafe-play" id="cafe-play" tabindex="-1">${screen==='setup'?setup():screen==='pour'?pour():outcome()}</section><p class="help model-note">${tx('Hương vị được tạo bởi mô hình trò chơi, không dự đoán chất lượng hay vị của cà phê thật.','Flavors come from a game model, not a prediction of real coffee taste or quality.')}</p>${sciencePanel(lang)}</details><button id="studio-toggle" class="secondary">${tx('Hồ sơ hạt & nhật ký · tùy chọn','Bean library & journal · optional')}</button><p class="help">${tx('Tiến độ quầy được lưu trên trình duyệt này khi có thể.','Counter progress is saved in this browser when available.')} ${rounds.length} ${tx('ly đã pha','cups brewed')}.</p></main>`;
  for(const [id,open] of optionalOpen)root.querySelector('#'+id).open=open;

  root.querySelector('#open-real-brew').onclick=()=>{const section=document.querySelector('#real-brew');section.querySelector('details').open=true;section.scrollIntoView({behavior:'smooth',block:'start'});};
  root.querySelector('#studio-toggle').onclick=()=>{studio.hidden=!studio.hidden;if(!studio.hidden)studio.scrollIntoView({behavior:'smooth'});};
  bindCounter();

   root.querySelectorAll('[name=cafe-bean]').forEach(el=>el.onchange=()=>{bean=el.value;rememberSetup();render();});

 function setup(){return `<h2>${currentLesson()?at(currentLesson().title):tx('Luyện theo nhịp của bạn','Practice your own rhythm')}</h2><p class="challenge-goal">${currentLesson()?at(currentLesson().goal):tx('Luyện rót ít tràn, thử nhịp khác hoặc pha lại công thức đã đánh dấu.','Practice reducing overflow, explore a new rhythm, or repeat your bookmarked recipe.')}</p>${lesson==='free'?`<label>${tx('Khách trong lượt tự do','Free-play guest')}<select id="free-guest">${cafeGuests.map((g,i)=>`<option value="${i}" ${guest===i?'selected':''}>${g.name}</option>`).join('')}</select></label>`:''}<button class="cafe-start cafe-quick">${tx('Pha ngay với lựa chọn bên dưới','Brew with the choices below')}</button><div class="bean-options">${cafeBeans.map(b=>`<label><input type="radio" name="cafe-bean" value="${b.id}" ${bean===b.id?'checked':''}><strong>${at(b.name)}</strong><small>${at(b.notes)} · ${tx('Lô giả lập, không đại diện mọi hạt cùng xuất xứ.','Fictional lot, not representative of all beans from this origin.')}</small></label>`).join('')}</div><label>${tx('Nhiệt độ · một yếu tố ảnh hưởng chiết xuất','Temperature · one factor affecting extraction')}<select id="cafe-heat">${[88,92,96].map(n=>`<option ${heat===n?'selected':''}>${n}</option>`).join('')}</select></label>${previous?`<aside class="experiment">${hint(previous)}</aside>`:''}<button id="cafe-start" class="cafe-start">${tx('Vào bàn rót','Start pouring')}</button><p class="help">${tx('Khoảng 30 giây. Nhấn giữ để rót, thả để nước rút. Không cần dụng cụ thật.','About 30 seconds. Hold to pour; release to let water drain. No equipment needed.')}</p>`;}
 function pour(){return `<h2>${currentLesson()?at(currentLesson().title):tx('Tự tay rót ly của bạn','Pour your own cup')}</h2>${currentLesson()?`<p class="challenge-goal">${at(currentLesson().goal)}</p>`:''}<p>${tx('12 g cà phê · 180 ml nước · cỡ xay cố định. Nhấn giữ để rót, thả để chờ nước rút. Đồng hồ chạy từ giọt đầu.','12 g coffee · 180 ml water · fixed grind. Hold to pour, release to drain. The clock starts with the first water.')}</p>${timers(state,true)}<div class="pour-setting"><div class="live-brew brew-apparatus" aria-hidden="true">${brewEquipment('counter')}</div></div><div class="live-stats"><span>${tx('Trong ly','In cup')}: <b id="live-beverage">0</b> ml</span><span>${tx('Đã rót','Poured')}: <b id="live-volume">0</b>/180 ml</span><span>${tx('Tràn khỏi phễu','Filter spill')}: <b id="live-spill">0</b> ml</span></div><progress id="live-progress" max="180" value="0" aria-label="${tx('Lượng nước đã rót','Water poured')}"></progress><p id="live-status" role="status">${tx('Sẵn sàng. Nhấn giữ để bắt đầu.','Ready. Hold to begin.')}</p><button id="hold-pour" class="hold-pour">${tx('Nhấn giữ để rót','Hold to pour')}</button><button id="toggle-pour" class="secondary">${tx('Bật / tắt rót bằng một lần chạm','Toggle pouring with one tap')}</button><p class="help">${tx('Bàn phím: giữ Space trên nút rót. Nút bật/tắt hỗ trợ thao tác không cần giữ. Chuyển ứng dụng sẽ tạm dừng.','Keyboard: hold Space on the pour button. Use the toggle for hold-free control. Switching apps pauses the game.')}</p><button id="cafe-abort" class="secondary">${tx('Pha lại từ đầu','Restart this cup')}</button>`;}
 function renderActions(){return `<div class="actions"><button id="cafe-retry">${tx('Pha lại & so sánh hai ly','Brew again & compare')}</button><button id="cafe-next" class="secondary" ${lesson!=='free'&&!learning().completed.includes(lesson)?'disabled':''}>${lesson==='free'?tx('Đổi khách · chơi tự do','Change guest · free play'):learning().completed.length===3?tx('Xem ba khám phá','View your three discoveries'):tx('Khám phá tiếp theo','Next discovery')}</button><button id="counter-bookmark" class="secondary" ${!savedResult()?'disabled':''}>${book.favoriteId===result.id?tx('✓ Đã đánh dấu công thức','✓ Recipe bookmarked'):tx('Đánh dấu công thức','Bookmark recipe')}</button>${!savedResult()?`<button id="counter-save-again">${tx('Thử lưu tiến độ lại','Retry saving progress')}</button>`:''}</div>`;}
 function outcome(){const b=cafeBeans.find(b=>b.id===result.bean);const response=result.fit===undefined?tx('Lượt cũ chưa lưu phản hồi của khách.','This older cup has no saved guest response.'):result.fit==='great'?tx('“Đúng gu tôi rồi! Cảm ơn bạn.”','“That’s my kind of coffee! Thank you.”'):result.fit==='close'?tx('“Khá gần rồi. Chỉnh một chút nữa nhé?”','“Pretty close. Could you adjust it a little?”'):tx('“Ly này có cá tính, nhưng chưa hợp gu tôi.”','“An interesting cup, but not quite my taste.”');
 return `<h2>${tx('Ly của bạn đã sẵn sàng','Your cup is ready')}</h2><div class="finished-cup" aria-hidden="true">☕</div><p class="guest-response">${response}</p><p>${at(b.name)} · ${result.heat}°C · ${tx('hương vị tương đối trong game','relative in-game flavor')}</p>${renderSkill()}${renderLearning()}${renderActions()}<p class="help">${tx('Mức vị giả định của game, không dự đoán ly thật.','Fictional game flavor bands, not predictions for a real cup.')}</p>${meters(result.flavor)}<details class="round-details"><summary>${tx('Thông số lượt này & giới hạn','Cup details & limits')}</summary>${timers(result)}<p>${tx('Giả định trò chơi, chưa hiệu chuẩn: chua/đắng giữ theo hồ sơ lô hạt hư cấu, không được tính từ cách pha. Chỉ nồng độ giả lập thay đổi theo phần chất hòa tan và lượng đồ uống. Không dùng kết quả này để dự đoán ly thật.','Uncalibrated game assumptions: acidity/bitterness stay fixed to the fictional lot profile, not inferred from brewing. Only fictional strength changes with dissolved material and beverage volume. These results do not predict a real cup.')}</p><p>${tx('Lượt này','This cup')}: ${cafeClock(result.contact)} ${tx('tiếp xúc khi có nước','wet contact')} · ${result.beverage??'—'} ml ${tx('trong ly','in cup')} · ${result.overflow} ml ${tx('tràn','spilled')}. ${tx('Chỉ số hòa tan giả lập · ngưỡng thiết kế','Fictional dissolution index · design thresholds')}: ${zoneLabel(result)}. ${tx('Mô hình giữ lại khoảng 24 ml nước trong bột; lượng nước rót không bằng lượng đồ uống.','The model retains about 24 ml in the grounds; poured water is not beverage yield.')}</p>${timeline(result)}</details>${previous?`<div class="cup-comparison"><h3>${tx('Hai ly khác nhau ở đâu?','What changed between cups?')}</h3><p>${tx('Ly trước → ly này','Previous → current')}: ${at(cafeBeans.find(b=>b.id===previous.bean).name)} ${previous.heat}°C → ${at(b.name)} ${result.heat}°C</p>${labels().map((l,i)=>`<p>${l}: <b>${level(previous.flavor[i])} → ${level(result.flavor[i])}</b> ${previous.flavor[i]===result.flavor[i]?tx('(chưa đổi mức)','(same level)'):''}</p>`).join('')}<p class="help">${tx('Các mức hương vị là khoảng tương đối; cùng mức không có nghĩa hai ly giống hệt.','Flavor levels are broad bands; the same level does not mean identical cups.')}</p><p>${tx('Tổng thời gian','Total time')}: ${cafeClock(previous.time)} → ${cafeClock(result.time)}</p><p>${tx('Thời gian rót','Pouring time')}: ${cafeClock(previous.pourTime)} → ${cafeClock(result.pourTime)}</p><p>${tx('Thời gian chờ','Waiting time')}: ${cafeClock(Math.floor(previous.time)-Math.floor(previous.pourTime))} → ${cafeClock(Math.floor(result.time)-Math.floor(result.pourTime))}</p><p>${tx('Tiếp xúc khi có nước','Wet contact')}: ${cafeClock(previous.contact)} → ${cafeClock(result.contact)}</p><p>${tx('Số nhịp rót','Pouring pulses')}: ${previous.holds} → ${result.holds}</p><p>${tx('Trong ly','In cup')}: ${previous.beverage} → ${result.beverage??'—'} ml</p><p>${tx('Nước tràn','Spilled')}: ${previous.overflow} → ${result.overflow} ml</p></div>`:''}<aside class="experiment">${hint(result)}</aside><details class="optional-note"><summary>${tx('Ghi một điều khám phá · tùy chọn','Note a discovery · optional')}</summary><label>${tx('Tôi nhận ra…','I noticed…')}<textarea id="cafe-note" maxlength="1000">${String(result.note||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</textarea></label><button id="save-cafe-note">${tx('Lưu ghi chú','Save note')}</button><p id="cafe-note-status" role="status"></p></details>`;

 function stopHolding(){holding=false;toggle=false;}
 function bindPour(){
  const resumeCounter=()=>{window.dispatchEvent(new Event('c6s-pause-cafe-tasting'));window.dispatchEvent(new Event('c6s-pause-practice'));cancelAnimationFrame(frame);last=null;frame=requestAnimationFrame(tick);};
  const button=root.querySelector('#hold-pour');
  button.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();resumeCounter();button.setPointerCapture(e.pointerId);toggle=false;holding=true;};
  button.onpointerup=button.onpointercancel=button.onlostpointercapture=()=>{holding=false;};
  button.onkeydown=e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();resumeCounter();toggle=false;holding=true;}};
  button.onkeyup=e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();holding=false;}};button.onblur=()=>{holding=false;};
  root.querySelector('#toggle-pour').onclick=()=>{const next=!toggle;resumeCounter();toggle=next;};
  root.querySelector('#cafe-abort').onclick=()=>{cancelAnimationFrame(frame);stopHolding();screen='setup';render();};
 }
 function bindNote(){root.querySelector('#save-cafe-note').onclick=()=>{const updated={...result,note:root.querySelector('#cafe-note').value};const next=savedResult()?{...book,rounds:rounds.map(r=>r.id===result.id?updated:r)}:addCounterRound(book,updated);if(writeBook(next)){const open=root.querySelector('.optional-note').open;result=updated;render();root.querySelector('.optional-note').open=open;root.querySelector('#cafe-note-status').textContent=tx('Đã lưu.','Saved.');}else{root.querySelector('#cafe-note-status').textContent=tx('Chưa lưu được. Hãy thử lại hoặc tải bản sao.','Not saved. Retry or download a backup.');}};}
 function tick(now){
  const dt=cafeFrameDelta(now,last);last=now;
  if(!document.hidden)state=cafeTick(state,holding||toggle,dt);
  if(state.done){stopHolding();window.dispatchEvent(new Event('c6s-simulation-result'));result={...cafeResult(state,guest),id:globalThis.crypto?.randomUUID?.()||`cup-${Date.now()}-${Math.random().toString(36).slice(2)}`,date:new Date().toISOString(),lesson:playedLesson,baselineId:previous?.id||null};writeBook(addCounterRound(book,result));screen='result';render();root.querySelector('#cafe-play').focus();return;}

  root.querySelector('#live-volume').textContent=state.poured>=180?180:Math.floor(state.poured);root.querySelector('#live-beverage').textContent=Math.round(state.drained);root.querySelector('#live-clock').textContent=cafeClock(state.time);root.querySelector('#live-pour-clock').textContent=cafeClock(state.pourTime);root.querySelector('#live-wait-clock').textContent=cafeClock(Math.floor(state.time)-Math.floor(state.pourTime));root.querySelector('#live-spill').textContent=Math.round(state.overflow);root.querySelector('#live-progress').value=state.poured;
  root.querySelector('.live-water').style.height=`${state.water/64*100}%`;root.querySelector('.live-cup .brew-coffee-fill').style.height=`${serverFillPercent(state.drained)}%`;
  root.querySelector('.live-brew').classList.toggle('is-draining',state.water>.5);root.querySelector('.live-brew').classList.toggle('is-overflowing',(holding||toggle)&&state.water>62);
  root.querySelector('.live-brew').classList.toggle('is-pouring',(holding||toggle)&&state.poured<180);
  const status=state.poured>=180?tx('Đủ nước! Đợi ly chảy xong…','Enough water! Let the cup drain…'):!state.started?tx('Sẵn sàng. Đồng hồ bắt đầu từ giọt nước đầu tiên.','Ready. The clock starts with the first water.'):state.water>49?tx('Nước trong phễu gần vạch tràn — thả nút để nước rút!','Near the filter’s overflow line — release to drain!'):(holding||toggle)?tx('Đang rót… quan sát mực nước.','Pouring… watch the water level.'):tx('Nước đang rút. Bạn chọn lúc rót tiếp.','Water is draining. Choose when to pour again.');if(root.querySelector('#live-status').textContent!==status)root.querySelector('#live-status').textContent=status;
  root.querySelector('#hold-pour').disabled=state.poured>=180;root.querySelector('#toggle-pour').disabled=state.poured>=180;root.querySelector('#toggle-pour').setAttribute('aria-pressed',String(toggle));
  frame=requestAnimationFrame(tick);
 }

const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
function nextExperiment(bean, parameters) {
  const field = Object.keys(weights).sort((a, b) => Math.abs(parameters[b] - bean.target[b]) * weights[b] - Math.abs(parameters[a] - bean.target[a]) * weights[a])[0];
  if (Number(parameters[field]) === bean.target[field]) return 'You matched this game recipe. Try another bean, or change one setting and compare the results.';
  const names = { dose: 'dose', water: 'water volume', temp: 'temperature', grind: 'grind setting' };
  return `Try ${parameters[field] > bean.target[field] ? 'lowering' : 'raising'} your ${names[field]} next. Keep the other settings unchanged to compare the effect. This hint follows the game model, not a measured extraction.`;
}
function progression(sessions, counterRounds = []) {
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const xp = sessions.length * 10 + discoveries * 5 + counterProgress(counterRounds).xp;
  const practices=[...sessions,...counterRounds];
  const allDiscoveries=discoveries+counterProgress(counterRounds).completed.length+counterRounds.filter(r=>r.note?.trim()).length;
  const level = Math.floor(xp / 50) + 1;
  const badges = [
    { name: 'First cup', hint: 'Save your first brew', earned: practices.length >= 1 },
    { name: 'Curious taster', hint: 'Record three discoveries', earned: allDiscoveries >= 3 },
    { name: 'Bean explorer', hint: 'Save brews with all three starter beans', earned: ['ethiopia', 'colombia', 'brazil'].every(id => practices.some(s => s.bean === id)) },
    { name: 'Practice makes progress', hint: 'Save five brews', earned: practices.length >= 5 }
  ];
  return { xp, level, remaining: 50 - xp % 50, progress: xp % 50, badges };
}

const fields = ['dose', 'water', 'temp', 'grind'];
const starterBeans = ['ethiopia', 'colombia', 'brazil'];

// Only saved sessions count. Missions are derived so old journals keep their progress.
function missionProgress(sessions) {
  const visited = starterBeans.filter(bean => sessions.some(s => s.bean === bean));
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const controlled = sessions.some((current, index) => {
    const previous = sessions[index - 1];
    if (!previous || current.bean !== previous.bean || !(typeof current.discovery === 'string' && current.discovery.trim())) return false;
    if (!fields.every(field => Number.isFinite(current.parameters?.[field]) && Number.isFinite(previous.parameters?.[field]))) return false;
    if(Boolean(current.pourRun)!==Boolean(previous.pourRun))return false;
    if(current.pourRun&&current.pourRun.scenario!==previous.pourRun.scenario)return false;
    if(current.pourRun&&(!validPourRun(current.pourRun,true)||!validPourRun(previous.pourRun,true)))return false;
    const before=previous.pourRun?pourSummary(previous.pourRun).decisions:[];
    const after=current.pourRun?pourSummary(current.pourRun).decisions:[];
    // A response to a newly changed cue is a consequence, not another independent variable.
    const actionChanges=after.filter((decision,i)=>decision.cue===before[i].cue&&decision.action!==before[i].action).length;
    return fields.filter(field => current.parameters[field] !== previous.parameters[field]).length + Number((current.technique || 'pulse') !== (previous.technique || 'pulse')) + actionChanges === 1;
  });
  const steadyBean = starterBeans.find(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length >= 3);
  const bestRun = Math.max(0, ...starterBeans.map(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length));
  const missions = [
    { id: 'explore', title: 'Meet the beans', description: 'Save one brew with each of the three starter beans.', count: visited.length, total: 3, bean: starterBeans.find(bean => !visited.includes(bean)) },
    { id: 'discover', title: 'Notice something new', description: 'Save three brews with a discovery: what did you notice or want to try next?', count: Math.min(discoveries, 3), total: 3 },
    { id: 'experiment', title: 'Change one thing', description: 'Save two consecutive brews of the same bean with exactly one recipe setting changed. Add a discovery to the second brew.', count: Number(controlled), total: 1 },
    { id: 'steady', title: 'Find your rhythm', description: 'Save three brews of the same bean with a simulated balance of 90 or more. This is a game recipe goal, not a taste assessment.', count: Math.min(bestRun, 3), total: 3, bean: steadyBean }
  ];
  let unlocked = true;
  return missions.map(mission => {
    const complete = mission.count >= mission.total;
    const result = { ...mission, complete, locked: !unlocked };
    unlocked = unlocked && complete;
    return result;
  });
}

const recipeFields = ['dose', 'water', 'temp', 'grind'];
const limits = { dose: [5, 50], water: [50, 800], temp: [75, 100], grind: [1, 40] };
const coffeeBeans = [
  { id: 'ethiopia', name: 'Ethiopia · Washed', target: { dose: 20, water: 300, temp: 94, grind: 18 }, notes: 'floral' },
  { id: 'colombia', name: 'Colombia · Honey', target: { dose: 20, water: 300, temp: 93, grind: 20 }, notes: 'caramel' },
  { id: 'brazil', name: 'Brazil · Natural', target: { dose: 20, water: 300, temp: 92, grind: 22 }, notes: 'chocolate' }
];
function validRecipe(parameters) {
  return recipeFields.every(k => Number.isFinite(parameters?.[k]) && parameters[k] >= limits[k][0] && parameters[k] <= limits[k][1]);
}
function brewScore(bean, parameters, technique = 'pulse') {
  if (!bean || !validRecipe(parameters) || !['pulse', 'steady', 'fast'].includes(technique)) throw new Error('Invalid recipe');
  const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
  return Math.max(0, Math.round(100 - recipeFields.reduce((sum, k) => sum + Math.abs(parameters[k] - bean.target[k]) * weights[k], 0) - ({pulse:0,steady:4,fast:12}[technique])));
}
function pourPlan(parameters) {
  if (!validRecipe(parameters)) throw new Error('Invalid recipe');
  const bloom = Math.min(Math.round(parameters.dose * 2), Math.floor(parameters.water / 3));
  return [bloom, Math.round((parameters.water + bloom) / 2), parameters.water];
}
function experimentHint(bean, parameters, technique) {
  const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
  const field = recipeFields.slice().sort((a,b) => Math.abs(parameters[b]-bean.target[b])*weights[b]-Math.abs(parameters[a]-bean.target[a])*weights[a])[0];
  if (parameters[field] !== bean.target[field]) return { field, direction: parameters[field] > bean.target[field] ? 'lower' : 'raise' };
  return { field: technique === 'pulse' ? 'matched' : 'technique' };
}
function loadJournal(raw) {
  if (raw === null) return { sessions: [], writable: true };
  try {
    const sessions = JSON.parse(raw);
    const optionalText = (s, key) => s[key] === undefined || typeof s[key] === 'string';
    const validTaste = taste => taste === undefined || taste === null || (typeof taste === 'object' && !Array.isArray(taste) && ['aroma','acidity','sweetness','bitterness','body','aftertaste'].every(k => taste[k] === undefined || taste[k] === null || (Number.isInteger(taste[k]) && taste[k] >= 1 && taste[k] <= 5)));
    const validSavedRun = run => run === undefined || (run && run.version === 1 && Number.isInteger(run.scenario) && run.scenario >= 0 && run.scenario <= 2 && ['pulse','steady','fast'].includes(run.technique) && Array.isArray(run.actions) && run.actions.length === 3 && run.actions.every((action,index) => [['swirl','settle'],['pause','feed','redistribute'],['recenter','finishEven']][index].includes(action)));
    const validOptional = s => validSavedRun(s.pourRun) && (s.pourRun === undefined || s.pourRun.technique === s.technique) && optionalText(s,'notes') && optionalText(s,'discovery') && validTaste(s.taste) && (s.technique === undefined || ['pulse','steady','fast'].includes(s.technique)) && (s.ratingMode === undefined || ['real','hypothesis'].includes(s.ratingMode)) && (s.mood === undefined || s.mood === null || (Number.isInteger(s.mood) && s.mood >= 1 && s.mood <= 5));
    if (!Array.isArray(sessions) || !sessions.every(s => s && validOptional(s) && (coffeeBeans.some(b => b.id === s.bean) || (typeof s.bean === 'string' && /^custom-[a-zA-Z0-9-]+$/.test(s.bean) && typeof s.beanProfile?.name === 'string' && s.beanProfile.name.trim().length > 0 && s.beanProfile.name.length <= 160)) && validRecipe(s.parameters) && typeof s.date === 'string' && Number.isFinite(Date.parse(s.date)) && ((s.bean.startsWith('custom-') && s.simulatedScore === null) || (!s.bean.startsWith('custom-') && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 0 && s.simulatedScore <= 100)))) throw new Error('Invalid journal');
    return { sessions, writable: true };
  } catch { return { sessions: [], writable: false, raw }; }
}
function tasteMean(session) {
  const values = ['aroma','acidity','sweetness','bitterness','body','aftertaste'].map(k => session.taste?.[k]).filter(n => Number.isFinite(n) && n >= 1 && n <= 5);
  return values.length ? (values.reduce((a,b) => a+b,0) / values.length).toFixed(1) : '—';
}

const pourStageNames = ['bloom','middle','finish'];
const pourChoices = [['swirl','settle'],['pause','feed','redistribute'],['recenter','finishEven']];
function validPourRun(run, complete=false) {
 return Boolean(run && run.version===1 && Number.isInteger(run.scenario) && run.scenario>=0 && run.scenario<=2 && ['pulse','steady','fast'].includes(run.technique) && Array.isArray(run.actions) && run.actions.length<=3 && (!complete||run.actions.length===3) && run.actions.every((action,index)=>pourChoices[index].includes(action)));
}
function createPourRun(scenario=0,technique='pulse') {
 const run={version:1,scenario,technique,actions:[]};if(!validPourRun(run))throw new Error('Invalid pour run');return run;
}
function evaluatePourChoice(run,index,action) {
 const before={...run,actions:run.actions.slice(0,index)};const cue=pourSituation(before);
 const good=action===cue.recommended;
 return {stage:pourStageNames[index],cue:cue.cue,action,good,penalty:good?0:cue.penalty,effect:good?cue.success:cue.miss};
}
function pourSituation(run) {
 if(!validPourRun(run)||run.actions.length>=3)throw new Error('No active pour stage');
 const index=run.actions.length;let cue,recommended,success,miss,penalty;
 if(index===0){
  const dry=run.technique==='fast'||run.scenario===2||(run.technique==='pulse'&&run.scenario===0);
  cue=dry?'dryBloom':'evenBloom';recommended=dry?'swirl':'settle';success=dry?'wetGrounds':'keptBed';miss=dry?'leftDry':'extraAgitation';penalty=6;
 }else if(index===1){
  const first=evaluatePourChoice(run,0,run.actions[0]);
  cue=first.effect==='leftDry'?'unevenFlow':run.technique==='fast'||run.scenario===0?'highWater':'lowWater';
  recommended=cue==='unevenFlow'?'redistribute':cue==='highWater'?'pause':'feed';
  success=cue==='unevenFlow'?'recoveredFlow':cue==='highWater'?'drainedWater':'maintainedWater';
  miss=cue==='unevenFlow'?'keptUneven':cue==='highWater'?'crowdedWater':'lostWater';penalty=8;
 }else{
  const middle=evaluatePourChoice(run,1,run.actions[1]);
  const tilted=!middle.good||run.scenario===2;
  cue=tilted?'tiltedBed':'levelBed';recommended=tilted?'recenter':'finishEven';success=tilted?'centeredFinish':'calmFinish';miss=tilted?'leftTilted':'disturbedFinish';penalty=6;
 }
 return {stage:pourStageNames[index],cue,recommended,success,miss,penalty,choices:pourChoices[index]};
}
function choosePourAction(run,action) {
 const situation=pourSituation(run);if(!situation.choices.includes(action))throw new Error('Invalid choice for this stage');
 const feedback=evaluatePourChoice(run,run.actions.length,action);
 return {run:{...run,actions:[...run.actions,action]},feedback};
}
function pourSummary(run) {
 if(!validPourRun(run))throw new Error('Invalid pour run');
 const decisions=run.actions.map((action,index)=>evaluatePourChoice(run,index,action));
 return {decisions,penalty:decisions.reduce((sum,d)=>sum+d.penalty,0),good:decisions.filter(d=>d.good).length};
}
function gameplayScore(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');
 if(!bean||!validRecipe(parameters))throw new Error('Invalid recipe');
 if(bean.custom)return null;
 return Math.max(0,brewScore(bean,parameters,'pulse')-pourSummary(run).penalty);
}
function nextPourGoal(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');
 const summary=pourSummary(run);const mistake=summary.decisions.find(d=>!d.good);
 if(mistake){const before={...run,actions:run.actions.slice(0,pourStageNames.indexOf(mistake.stage))};return {type:'action',stage:mistake.stage,action:pourSituation(before).recommended};}
 if(!bean.custom){
  const hint=experimentHint(bean,parameters,'pulse');
  if(hint.field!=='matched'){
   const steps={dose:1,water:10,temp:1,grind:1};const direction=hint.direction==='raise'?1:-1;
   const target=bean.target[hint.field];const next=direction>0?Math.min(target,parameters[hint.field]+steps[hint.field]):Math.max(target,parameters[hint.field]-steps[hint.field]);
   return {type:'parameter',field:hint.field,value:Math.max(limits[hint.field][0],Math.min(limits[hint.field][1],next))};
  }
 }
 return {type:'technique',value:run.technique==='fast'?'steady':run.technique==='steady'?'fast':run.scenario===0?'steady':'fast'};
}

function capture() {

  if (taste && draft && stage === 'tasting') {

    draft.mood = taste.elements.mood.value === '' ? null : Number(taste.elements.mood.value);

function pourGoalText(goal, session) {

}
function renderPourReport(run) {

}
function beginPour(quick=false) {

 if(quick){recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};recipe.technique='pulse';delete recipe.scenario;retryGoal=null;retrySource=null;}
 if(!validRecipe(recipe.parameters))return;
 const scenario=recipe.scenario??(isFirstDecisionRound()?0:Math.floor(Math.random()*3));

  return `${result}<form id="taste"><h3 id="taste-title" tabindex="-1">${t('tasteTitle')}</h3><label>${t('mode')}<select name="ratingMode"><option value="hypothesis" ${draft.ratingMode==='hypothesis'?'selected':''}>${t('hypothesis')}</option><option value="real" ${draft.ratingMode==='real'?'selected':''}>${t('real')}</option></select></label><p class="help">${t('modeHelp')}</p><p class="help">${t('quickReflect')}</p><details id="sensory-details" ${showSensory?'open':''}><summary>${t('sensoryDetails')}</summary><p>${t('ratingsHelp')}</p><div class="fields">${ratingFields()}</div>${ratingSelect('mood',draft.mood)}<p class="help">${t('moodHelp')}</p></details><label>${t('notes')}<textarea name="notes" maxlength="1000" rows="3" placeholder="${t('notesPlaceholder')}">${esc(draft.notes)}</textarea></label><label>${t('discovery')}<textarea name="discovery" maxlength="1000" rows="2" placeholder="${t('discoveryPlaceholder')}">${esc(draft.discovery)}</textarea></label><p id="save-error" role="alert" tabindex="-1">${saveError?t('saveError'):''}</p><div class="actions"><button type="submit" ${journal.writable?'':'disabled'}>${t('save')}</button><button type="button" id="draft-export" class="secondary">${t('draftExport')}</button><button type="button" id="cancel" class="secondary">${t('cancel')}</button></div></form>`;
}
function renderHistory() {

function changeRecipe(session, prompt='') {

function bind(activeMission) {
