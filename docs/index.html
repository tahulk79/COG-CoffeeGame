 {
 id:'s1-v60',title:['Chiếc phễu không chịu nằm yên','The dripper that would not sit still'],kind:'tool',tool:'v60',item:['HARIO V60 · góc 60°','HARIO V60 · the 60° cone'],place:['Nhật Bản','Japan'],color:'#adbcb2',sources:['v60'],
 guest:{name:'Luca Rossi',origin:['Ý · Châu Âu','Italy · Europe'],portrait:1,line:['“Trông giống một cái phễu. Sao ông lại nâng niu nó thế?”','“It looks like a funnel. Why are you so fond of it?”']},
 arrival:['Tiếng gõ nhẹ phát ra từ quầy. Chủ quán đang thử đặt một chiếc phễu lên ba cái cốc khác nhau. “À, may quá, có bạn làm chứng: không phải cái cốc nào cũng vừa chân đế này.”','A gentle tapping comes from the counter. The owner is trying a dripper on three cups. “Good, a witness: not every cup fits this base.”'],
 acquisition:['“Tôi đổi một buổi chỉ cách ghi nhật ký pha lấy chiếc V60 này từ một người bạn. Cô ấy đã lên đời đồ mới, còn tôi muốn giữ một dụng cụ đủ đơn giản để khách nhìn thấy nước đi qua.”','“I traded a lesson in brew journaling for this V60. My friend had moved on to new gear; I wanted something simple enough for guests to see water passing through.”'],
 story:[['“Tên V60 gợi đến thân nón 60 độ. Nhìn bên trong nhé: những đường gân và lỗ thoát lớn khiến nó khác một chiếc bát có chọc lỗ. Giấy lọc cũng là một phần của cách pha, chứ không chỉ là đồ lót cho sạch.”','“V60 refers to its 60-degree cone. Look inside: ribs and a large outlet make it different from a bowl with a hole. The paper filter is part of brewing, not just a liner to keep things tidy.”'],['“Tôi thích nó vì mình có thể quan sát, không phải vì nó hứa làm mọi ly ngon hơn. Ngăn hôm nay để cạnh ngăn Yemen: món hạt và cách mình đối xử với nó là hai câu chuyện khác nhau.”','“I like it because we can observe, not because it promises to improve every cup. This drawer goes beside Yemen: the coffee and how we handle it are two different stories.”']],
 answer:['“Vì một đồ vật bình thường có thể làm mình đặt câu hỏi. Cùng là lọc bằng giấy, hình dáng, giấy và cách rót vẫn cần được ghi lại nếu muốn so sánh công bằng.”','“Because an ordinary object can make us ask questions. Even with paper filtration, shape, paper and pouring need recording if we want a fair comparison.”'],
 facts:[['V60 có thân nón, gân bên trong và lỗ thoát lớn.','V60 has a cone, internal ribs and a large outlet.'],['Cần làm ướt giấy và bỏ nước tráng trước khi bắt đầu công thức.','Rinse the paper and discard the rinse water before the recipe.'],['Đổi dụng cụ không tự bảo đảm đồ uống hợp khẩu vị hơn.','Changing equipment does not automatically improve personal liking.']],
 invitation:['“Bạn muốn sắp lại bàn chuẩn bị, hay thử nhìn dòng nước ở bàn luyện? Tôi đứng cạnh, không giao cả quán cho bạn đâu.”','“Want to arrange the preparation steps, or watch water at the practice station? I’ll stay beside you; you’re not running the café.”'],
 ending:['Chủ quán treo chiếc V60 lên móc riêng. “Thêm một dụng cụ không phải thêm một đáp án. Là thêm một cách hỏi.” Luca xoay tách, nhìn lại cái lỗ ở đáy phễu lần nữa.','The owner hangs the V60 on its hook. “Another tool is another way to ask, not another answer.” Luca turns his cup and takes one more look at the dripper’s outlet.'],
 teaser:['Hai túi Ethiopia, cùng một địa danh nhưng khác dòng sơ chế.','Two Ethiopian bags, one place name and different processing lines.'],modes:['order','memory','brew'],
 quiz:{question:['Tên V60 gợi tới đặc điểm nào?','What does V60 refer to?'],choices:[['Dung tích 60 ml','A 60 ml capacity'],['Thân nón góc 60°','A 60° cone'],['Bắt buộc rót 60 giây','A mandatory 60-second pour']],correct:1,explanation:['Con số mô tả thiết kế, không phải dung tích hay thời gian pha.','The number describes the design, not a capacity or brew duration.']},

 {
 id:'s1-yirgacheffe',title:['Hai túi hạt, một tấm địa chỉ','Two bags, one address'],kind:'bean',item:['Ethiopia · Yirgacheffe, Washed & Natural','Ethiopia · Yirgacheffe, Washed & Natural'],place:['Ethiopia','Ethiopia'],color:'#9da46d',sources:['processing','wcr'],
 guest:{name:'Amina Njeri',origin:['Kenya · Châu Phi','Kenya · Africa'],portrait:2,line:['“Cùng ghi Yirgacheffe, tại sao ông không gộp vào một hũ?”','“Both say Yirgacheffe. Why not put them in one jar?”']},
 arrival:['Trên quầy có hai túi hạt buộc chung một sợi dây. Chủ quán cắt dây, đặt chúng cách nhau một khoảng. “Đi cùng một kiện hàng không có nghĩa là cùng một câu chuyện.”','Two bags on the counter share a string. The owner cuts it and separates them. “Sharing a parcel doesn’t mean sharing a story.”'],
 acquisition:['“Tôi nhận lời phụ dọn một buổi thử hạt để xin hai mẫu Ethiopia mang về. Hai túi cùng ghi Yirgacheffe, nên tôi lỡ viết sẵn một thẻ. Đến lúc thấy Washed và Natural, tôi phải moi tấm thẻ thứ hai ra từ đống giấy đã dọn.”','“I helped clear up a coffee tasting in exchange for two Ethiopian samples. Both said Yirgacheffe, so I wrote just one card. When I noticed Washed and Natural, I had to rescue a second card from the papers I had cleared away.”'],
 story:[['“Với cách natural, quả thường được làm khô trước khi bóc lớp ngoài. Với washed, thịt quả và lớp nhầy được loại bỏ trước khi hạt được làm khô. Tên vùng kể một phần; dòng sơ chế kể một phần khác.”','“In natural processing, cherries are generally dried before outer layers are removed. Washed processing removes pulp and mucilage before drying the seed. A region tells one part; processing tells another.”'],['“Tôi không gọi đây là thí nghiệm chứng minh sơ chế làm đổi vị, vì chưa biết hai mẫu có cùng giống, rang và nhiều điều kiện khác hay không. Nhưng chúng rất hợp để tập nhìn nhãn trước khi tập phán đoán.”','“I won’t call this proof that processing caused a taste difference: variety, roasting and other conditions may differ. But they are a good reason to practice reading before judging.”']],
 answer:['“Một địa danh không phải căn cước đầy đủ của một lô. Gộp lại thì mình mất cơ hội hỏi mỗi túi đã đi qua những bước nào.”','“A place name isn’t a lot’s full identity. Mixing them would lose our chance to ask how each was handled.”'],
 facts:[['Xuất xứ và sơ chế là hai trường thông tin riêng.','Origin and processing are separate fields.'],['Natural thường làm khô nguyên quả; washed thường bỏ thịt quả và lớp nhầy trước khi làm khô hạt.','Natural generally dries the whole cherry; washed generally removes pulp and mucilage before drying.'],['Hai lô khác nhau chưa tạo thành phép so sánh chỉ thay một biến.','Two different lots are not automatically a one-variable comparison.']],
 invitation:['“Chọn một trò nhỏ để ghép những thông tin vừa thấy nhé. Không có câu hỏi bắt bạn đoán mùi từ tên nước đâu.”','“Try a small game with what we just saw. Nothing asks you to guess a flavor from a country name.”'],
 ending:['Hai túi hạt được đặt cạnh nhau, nhưng không trộn. Chủ quán viết hai dòng nhãn rõ ràng. “Hôm nay điều mới không nằm trong một lời khen. Nó nằm trong một câu hỏi chính xác hơn.”','The bags sit together, unmixed. The owner writes two clear labels. “Today’s discovery isn’t a compliment. It’s a more precise question.”'],
 teaser:['Một trang công thức nổi tiếng, và điều chiếc cân thật sự đang đếm.','A famous recipe, and what its scale is actually counting.'],modes:['clue','memory','order'],
 quiz:{question:['Để biết túi nào đã được làm khô nguyên quả, cần đọc dòng nào?','Which field helps identify whole-cherry drying?'],choices:[['Xuất xứ','Origin'],['Sơ chế','Processing'],['Màu của túi','Bag color']],correct:1,explanation:['Dòng sơ chế cho biết phương pháp; chỉ địa danh hay màu bao bì chưa đủ.','Processing identifies the method; a region or packaging color does not.']},
 order:[['Đọc xuất xứ','Read the origin'],['Đọc riêng dòng sơ chế','Read processing separately'],['Ghi điều còn thiếu trước khi so sánh','Record missing details before comparing']],pairs:[['Địa danh','Place'],['Sơ chế','Processing'],['Hồ sơ lô','Lot record']],symbols:['⌖','◌','▤']
 },

 id:'s1-hoffmann',title:['Trang giấy có ba vạch nước','The page with three water marks'],kind:'recipe',item:['James Hoffmann · Ultimate V60','James Hoffmann · Ultimate V60'],place:['30 g cà phê / 500 g nước','30 g coffee / 500 g water'],color:'#c3ac73',sources:['hoffmann'],referenceId:'hoffmann-ultimate-v60-v1',
 guest:{name:'Noah Martin',origin:['Canada · Bắc Mỹ','Canada · North America'],portrait:5,line:['“500 g trên cân là 500 g cà phê uống được à?”','“Does 500 g on the scale mean 500 g of coffee to drink?”']},
 arrival:['Chủ quán đang vẽ ba vạch lên một tờ giấy: 60, 300, 500. “Hôm nay không có bí kíp gia truyền. Tôi mang về một công thức có tên người chia sẻ, để bạn còn tìm lại được.”','The owner writes three marks: 60, 300, 500. “No secret family recipe today. This one has its creator’s name, so you can find it again.”'],
 acquisition:['“Tôi chép các mốc từ hướng dẫn Ultimate V60 của James Hoffmann vào sổ, kèm đường dẫn gốc. Tôi giữ trang cũ có chỗ tẩy xóa để nhớ: một công thức tốt còn phải được ghi cho đúng.”','“I put the milestones from James Hoffmann’s Ultimate V60 into the notebook, with the original link. I kept the eraser marks to remind myself that a recipe has to be recorded accurately.”'],
 story:[['“Mẫu này dùng 30 g cà phê và 500 g nước đầu vào. Bloom 60 g, swirl, chờ tới 0:45; đạt tổng 300 g ở 1:15 và 500 g ở 1:45. Các số trên cân là tổng tích lũy, không phải mỗi lần rót thêm từng ấy.”','“The example uses 30 g coffee and 500 g input water. Bloom with 60 g, swirl, wait to 0:45; reach 300 g total by 1:15 and 500 g by 1:45. Those are cumulative scale readings, not amounts added each time.”'],['“Sau đó khuấy một vòng mỗi chiều, swirl nhẹ và để nước rút. Khoảng 3:30 là mốc tham khảo, không phải tiếng chuông phán xét. Bản luyện nhanh của quán chỉ tập lượng nước; khi pha thật mình mở hướng dẫn thời gian thực.”','“Then stir once each way, swirl gently and drain. Around 3:30 is a reference, not a judgment bell. Our accelerated station only practices water targets; for a real brew we open the real-time guide.”']],
 answer:['“Không. Bột giữ lại một phần nước; nước đầu vào và đồ uống thu được là hai số khác nhau. Nhớ ghi cả hai nếu mình cần đối chiếu.”','“No. The grounds retain some water; input and beverage yield are different measurements. Record both when comparing.”'],
 facts:[['Ba mốc nước tích lũy: 60 → 300 → 500 g.','Cumulative targets: 60 → 300 → 500 g.'],['Lượng rót thêm tương ứng: 60, 240, 200 g.','Added amounts: 60, 240, 200 g.'],['Thời gian rút là mốc tham khảo, không tự chứng minh vị ngon.','Drawdown time is a reference, not proof of good flavor.']],
 invitation:['“Thử phân biệt lượng thêm với tổng trên cân, hay vào bàn rót một lượt? Bạn cũng có thể giữ nguyên chiếc tách và nghe tiếp.”','“Try added amounts versus scale totals, or visit the station? You can also keep your cup and just listen.”'],
 ending:['Chủ quán ký tên James Hoffmann ở đầu trang, rồi ký chữ nhỏ “bản ghi của C6S” ở dưới. “Người chia sẻ xứng đáng có tên. Còn chỗ nào tôi sửa cho trò chơi thì phải nói rõ.”','The owner writes James Hoffmann at the top and “C6S notes” beneath. “The creator deserves credit. Anything I adapt for the game needs saying too.”'],
 teaser:['Một túi Kenya có con số 28 nhưng không chỉ cỡ hạt.','A Kenyan bag whose 28 is not a bean size.'],modes:['clue','order','brew'],
 quiz:{question:['Cân đang ở 300 g, mục tiêu cuối là 500 g. Cần thêm bao nhiêu?','The scale reads 300 g; the final target is 500 g. How much more?'],choices:[['500 g','500 g'],['200 g','200 g'],['300 g','300 g']],correct:1,explanation:['500 − 300 = 200 g; đừng rót thêm nguyên lượng tích lũy.','500 − 300 = 200 g; do not add the entire cumulative target.']},

 {
 id:'s1-sl28',title:['Con số trên chiếc kẹp gỗ','The number on the wooden clip'],kind:'bean',item:['Kenya · giống SL28','Kenya · SL28 variety'],place:['Kenya','Kenya'],color:'#9e6970',sources:['sl28'],
 guest:{name:'Farah Haddad',origin:['Jordan · Châu Á','Jordan · Asia'],portrait:3,line:['“Số 28 là điểm hay kích cỡ hạt vậy?”','“Is 28 a score or a bean size?”']},
 arrival:['Một chiếc kẹp gỗ ghi “28” đang giữ túi hạt mới. Chủ quán thấy bạn nhìn thì bật cười. “Tôi cũng từng đọc một cái nhãn rồi tưởng mình biết hết.”','A wooden clip marked “28” holds a new bag. The owner catches your glance and laughs. “I once read a label and thought I understood everything too.”'],
 acquisition:['“Tôi đăng ký nhầm một buổi giới thiệu giống cây, tưởng đó là buổi thử hạt Kenya. Đã đến nơi thì ngồi nghe; cuối buổi xin được một mẫu ghi SL28 và tờ hồ sơ giống. Đi nhầm cửa mà có món mang về, cũng đáng chứ?”','“I signed up for a variety introduction by mistake, thinking it was a Kenyan coffee tasting. Since I was there, I listened. At the end I came away with an SL28 sample and its variety notes. The wrong door still led somewhere worth visiting.”'],
 story:[['“SL28 là tên một giống Arabica được tuyển chọn tại Scott Laboratories ở Kenya. Tôi tưởng 28 sẽ là một mật mã khó học; hóa ra đầu tiên chỉ cần biết mình đang đọc tên giống, không phải bảng điểm. Danh mục WCR có hồ sơ để lần lại câu chuyện ấy.”','“SL28 is an Arabica variety selected at Scott Laboratories in Kenya. I expected 28 to be a difficult code; first I only needed to recognize a variety name rather than a score. The WCR catalog has a profile to trace that story.”'],['“Tôi có thể kể về giống, nhưng chưa thể bảo mọi túi SL28 đều có một mùi giống hệt nhau. Nông trại, thời tiết, sơ chế, rang và cách pha vẫn chưa biến mất chỉ vì mình đã biết tên giống.”','“I can tell you about a variety without claiming every SL28 bag smells the same. Farm, weather, processing, roasting and brewing do not disappear when we learn a variety name.”']],
 answer:['“Là tên giống. Một số trên nhãn có thể là tên, điểm, cỡ sàng hoặc mã lô; cần đọc nó đi cùng từ nào. Đoán nhầm đơn vị dễ hơn mình tưởng.”','“It’s a variety name. A label number might be a name, score, screen size or lot code; read the words around it. Misreading a unit is surprisingly easy.”'],
 facts:[['SL28 là tên giống Arabica, không phải điểm số.','SL28 is an Arabica variety name, not a score.'],['Xuất xứ Kenya không đồng nghĩa mọi hạt trong nước đều là SL28.','Kenyan origin does not mean every coffee there is SL28.'],['Tên giống không bảo đảm một hương vị cố định cho mọi lô.','A variety name does not guarantee one fixed flavor across lots.']],
 invitation:['“Mình thử gỡ những chiếc nhãn tưởng như đã hiểu nhé? Không cần thuộc lòng tất cả các giống để thưởng thức một ly.”','“Shall we untangle some familiar-looking labels? You don’t have to memorize every variety to enjoy a cup.”'],
 ending:['Chủ quán kẹp nhãn SL28 cạnh tấm bản đồ, không đặt cạnh bảng điểm. Farah chỉ vào khoảng trống dành cho hồ sơ lô. “Để trống như thế cũng là một câu trả lời tử tế.”','The owner clips SL28 beside the map, not the score sheet. Farah points to the empty lot-record field. “Leaving that blank can be an honest answer too.”'],
 teaser:['Một dụng cụ trông như chiếc ống được mang theo trong ba lô.','A brewer that looks like a tube and travels in a backpack.'],modes:['clue','memory','postcard'],
 quiz:{question:['SL28 trên nhãn hôm nay thuộc trường nào?','Which label field does SL28 belong to?'],choices:[['Giống','Variety'],['Điểm cảm quan','Sensory score'],['Nhiệt độ rang','Roast temperature']],correct:0,explanation:['Đây là tên giống; số 28 không mang đơn vị điểm hay độ C.','It is a variety name; 28 has neither points nor Celsius units.']},
 order:[['Tìm tên trường trên nhãn','Find the field name'],['Đọc giá trị của trường','Read its value'],['Ghi điều chưa rõ để hỏi lại','Note uncertainties to ask about']],pairs:[['SL28 · giống','SL28 · variety'],['Kenya · xuất xứ','Kenya · origin'],['Hồ sơ lô','Lot record']],symbols:['❧','⌖','▤']

 {
 id:'s1-aeropress',title:['Bình pha trong chiếc ba lô','The brewer in a backpack'],kind:'tool',tool:'aeropress',item:['AeroPress · chiếc ống pha nhỏ','AeroPress · the little brewing tube'],place:['Thiết kế của Alan Adler','Designed by Alan Adler'],color:'#8a9e9d',sources:['aeropress'],
 guest:{name:'Mateo Cruz',origin:['Mexico · Bắc Mỹ','Mexico · North America'],portrait:5,line:['“Nó nhỏ thế, có phải máy espresso bỏ túi không?”','“Is that a pocket espresso machine?”']},
 arrival:['Chủ quán mở ba lô thay vì kiện hàng. Một chiếc ống nhựa lăn ra cùng tấm vé tàu cũ. “Đồ hôm nay không cần chiếm nhiều chỗ mới có chuyện để kể.”','The owner opens a backpack instead of a parcel. A plastic tube rolls out with an old train ticket. “Today’s object doesn’t need much space to have a story.”'],
 acquisition:['“Tôi mua chiếc AeroPress sau một chuyến đi chỉ có ấm nước nóng và một chiếc cốc. Cất về quán, tôi vẫn giữ nó trong ba lô để nhớ mình đã cần điều gì lúc đó: một cách pha gọn, không phải thêm một góc máy móc.”','“I bought this AeroPress after a trip with only a hot-water kettle and a cup. I still keep it in a backpack here: I wanted compact brewing, not another machinery corner.”'],
 story:[['“AeroPress do Alan Adler thiết kế. Cà phê tiếp xúc với nước trong buồng pha, rồi piston đẩy đồ uống qua bộ lọc. Nhìn ít bộ phận, nhưng vẫn có lượng cà phê, nước, thời gian và thao tác để lựa chọn.”','“AeroPress was designed by Alan Adler. Coffee contacts water in a chamber, then a plunger pushes the drink through a filter. Few parts still leave choices of coffee, water, time and handling.”'],['“Tôi giới thiệu cách dùng thông thường, đặt chắc trên cốc phù hợp; không cần lật một bình nước nóng để thấy mình giỏi hơn. Sự tiện lợi nên làm buổi sáng dễ chịu, chứ không thêm trò mạo hiểm.”','“I introduce the upright approach, stable on a suitable cup. Turning hot water upside down isn’t a test of skill. Convenience should make the morning easier.”']],
 answer:['“Có piston không có nghĩa là vận hành ở áp suất như máy espresso. Mình nên gọi đúng cách pha, rồi thử xem có thích ly tạo ra từ nó không.”','“A plunger does not mean espresso-machine pressure. Name the method accurately, then see whether you enjoy the cup it makes.”'],
 facts:[['AeroPress do Alan Adler thiết kế.','AeroPress was designed by Alan Adler.'],['Buồng pha và piston đưa đồ uống qua bộ lọc.','A chamber and plunger move the beverage through a filter.'],['Không đồng nhất mọi dụng cụ có lực ép với máy espresso.','Not every pressure-assisted brewer is an espresso machine.']],
 invitation:['“Cùng ghép những bộ phận hoặc giữ một bưu thiếp cho chuyến đi tưởng tượng nhé. Hôm nay mình không mô phỏng áp suất.”','“Match the parts or keep a postcard for an imaginary trip. We aren’t simulating pressure today.”'],
 ending:['Chủ quán đặt chiếc vé tàu dưới dụng cụ trong tủ. “Một món sưu tầm đáng giữ vì nó từng giải quyết được một nhu cầu, chứ không chỉ vì nó mới.” Mateo kéo ba lô khỏi lối đi, nhường chỗ cho chiếc ghế khác.','The owner puts the train ticket beneath the brewer. “Something is worth keeping because it answered a need, not simply because it was new.” Mateo moves his backpack to make room for another chair.'],
 teaser:['Một tên giống có thể xuất hiện trên nhãn của nhiều quốc gia.','A variety name that can appear on bags from several countries.'],modes:['memory','clue','postcard'],
 quiz:{question:['Có piston nghĩa là AeroPress giống hệt máy espresso không?','Does having a plunger make AeroPress identical to espresso?'],choices:[['Có, chỉ khác kích thước','Yes, only smaller'],['Không, cần phân biệt cơ chế và áp suất','No, distinguish mechanism and pressure'],['Mọi dụng cụ đều cho cùng kết quả','Every brewer produces the same result']],correct:1,explanation:['Tên và cơ chế giúp hiểu dụng cụ; hình dáng piston không đủ để đồng nhất hai phương pháp.','Names and mechanisms matter; a plunger alone does not make the methods equivalent.']},
 order:[['Chuẩn bị bộ lọc và cốc phù hợp','Prepare the filter and a suitable cup'],['Cho cà phê và nước vào buồng pha','Add coffee and water to the chamber'],['Ép qua bộ lọc theo hướng dẫn hãng','Plunge through the filter per manufacturer guidance']],pairs:[['Buồng pha','Chamber'],['Piston','Plunger'],['Bộ lọc','Filter']],symbols:['▥','↧','◌']
 },
 {
 id:'s1-geisha',title:['Tấm vé không đi cùng tên giống','The ticket and the variety name'],kind:'bean',item:['Panama · Geisha','Panama · Geisha'],place:['Panama','Panama'],color:'#c69b87',sources:['geisha'],
 guest:{name:'Aiko Tanaka',origin:['Nhật Bản · Châu Á','Japan · Asia'],portrait:4,line:['“Tên này khiến tôi nghĩ tới Nhật. Có phải giống từ đó không?”','“That name makes me think of Japan. Is the variety from there?”']},
 arrival:['Chủ quán đặt một túi hạt nhỏ xíu cạnh tấm bưu thiếp lớn. “Lượng hạt có hạn, nhưng tôi không định dùng giá tiền để kể thay câu chuyện.”','The owner sets a tiny bag beside a large postcard. “There isn’t much coffee, but I won’t let its price tell the story.”'],
 acquisition:['“Tôi không mua nổi một túi lớn cho quán, nên rủ một nhóm bạn chia mẫu Panama Geisha. Mỗi người mang một chiếc lọ nhỏ; cả buổi giống chia gia vị hơn đấu giá kho báu. Phần của C6S đủ vài mẻ và một buổi ngồi lại cùng nhau.”','“A large bag was beyond our budget, so friends and I shared a Panama Geisha sample. Everyone brought a tiny jar; it looked more like sharing spices than bidding for treasure. C6S’s portion is a few brews and a reason to sit together.”'],
 story:[['“Hồ sơ Geisha nổi tiếng tại Panama lần về Ethiopia, rồi qua những chặng di chuyển cây giống, trong đó có Costa Rica, trước khi đến Panama. Tôi trải ba tấm địa danh lên bàn: một tên giống đã đi xa hơn đường thẳng trên bản đồ của mình.”','“The profile of the Geisha prominent in Panama traces back to Ethiopia, with planting material traveling through places including Costa Rica before Panama. I spread three place cards on the table: this variety has traveled farther than my map’s straight lines suggest.”'],['“Cũng đừng gọi mọi túi ghi Geisha là giống hệt nhau. Cần hồ sơ giống và lô cụ thể. Hôm nay quán sưu tầm một câu hỏi về nguồn gốc, không bán lời hứa rằng bạn bắt buộc phải thấy hương hoa.”','“And not every bag labeled Geisha should be treated as identical. Variety and lot records matter. Today we collect a question about origins, not a promise that you must perceive flowers.”']],
 answer:['“Không nên suy ra nơi xuất phát từ âm của tên. Mình tra hồ sơ giống, rồi phân biệt nguồn gốc giống với nơi lô hạt hiện tại được trồng.”','“We shouldn’t infer origin from how a name sounds. Check the variety profile and distinguish a variety’s origin from where this lot was grown.”'],
 facts:[['Nguồn gốc giống và nơi trồng một lô là hai điều khác nhau.','Variety origin and a lot’s growing location are different.'],['Geisha nổi tiếng tại Panama có hồ sơ giống liên hệ Ethiopia.','The Geisha prominent in Panama has a profile linked to Ethiopia.'],['Tên nổi tiếng và giá cao không bắt buộc người uống phải thích.','A famous name and high price do not oblige anyone to enjoy it.']],
 invitation:['“Bạn muốn tìm manh mối trên nhãn, hay chọn một góc cất bưu thiếp? Không phải buổi thi xem ai biết hạt đắt hơn đâu.”','“Look for label clues, or choose a place for the postcard? This isn’t a contest of who knows the most expensive coffee.”'],
 ending:['Aiko đặt tấm bưu thiếp dưới túi hạt thay vì dựng bảng giá. Chủ quán gật đầu. “Trong tủ này, một điều mình hiểu thêm đáng giữ hơn một con số để khoe.”','Aiko puts the postcard beneath the coffee instead of a price card. The owner nods. “In this cabinet, understanding is worth keeping more than a number to show off.”'],
 teaser:['Một túi ghi Honey, bên cạnh không hề có lọ mật ong.','A bag marked Honey, with no honey jar beside it.'],modes:['clue','memory','postcard'],
 quiz:{question:['“Panama Geisha” chắc chắn cho biết điều nào?','What does “Panama Geisha” describe here?'],choices:[['Người uống chắc chắn thấy hương hoa','Everyone must perceive flowers'],['Nơi trồng được ghi và tên giống được ghi','The stated growing country and variety'],['Giống chắc chắn bắt nguồn từ Nhật','The variety must originate in Japan']],correct:1,explanation:['Đọc đúng hai trường nhãn; vẫn cần hồ sơ lô, không suy ra sở thích hay lịch sử chỉ từ âm tên.','Read the two fields; lot records still matter, and the name does not establish liking.']},
 order:[['Đọc nơi trồng của lô','Read the lot’s growing location'],['Tra riêng hồ sơ giống','Consult the variety profile separately'],['Giữ câu hỏi chưa có dữ liệu','Keep questions without inventing answers']],pairs:[['Ethiopia · nguồn gốc','Ethiopia · origins'],['Panama · nơi trồng','Panama · growing place'],['Hồ sơ giống','Variety profile']],symbols:['❧','⌖','▤']
 },
 {
 id:'s1-honey',title:['Chiếc lọ mật ong bị bỏ quên','The unused honey jar'],kind:'bean',item:['Costa Rica · Honey process','Costa Rica · Honey process'],place:['Costa Rica','Costa Rica'],color:'#c69f55',sources:['processing'],
 guest:{name:'Camila Santos',origin:['Brazil · Nam Mỹ','Brazil · South America'],portrait:3,line:['“Tôi có cần lấy lọ mật ong xuống không?”','“Should I take down the honey jar?”']},
 arrival:['Camila đã lấy sẵn một chiếc thìa. Chủ quán đưa túi hạt ghi Honey ra rồi cất thìa trở lại. “Hôm nay cái tên ngọt hơn danh sách nguyên liệu đấy.”','Camila has fetched a spoon. The owner brings out a bag marked Honey and puts the spoon away. “Today the name is sweeter than the ingredient list.”'],
 acquisition:['“Tôi xin mẫu Costa Rica này từ một buổi giới thiệu sơ chế. Người gửi kèm hình hạt đang được làm khô, chứ không gửi mật ong. Tôi giữ cái thìa cạnh túi để kể lại lần hiểu nhầm rất dễ thương ấy.”','“I requested this Costa Rican sample at a processing introduction. It came with a picture of drying seeds, not honey. I kept the spoon with the bag as a reminder of an easy misunderstanding.”'],
 story:[['“Honey thường để lại một phần lớp nhầy trên hạt đã tách vỏ quả khi làm khô. Tên gọi không có nghĩa là trộn thêm mật ong. Cách giữ lớp nhầy và phơi có thể khác nhau giữa nơi làm.”','“Honey processing generally retains some mucilage on depulped seeds during drying. The name doesn’t mean adding honey. Retention and drying practices vary between producers.”'],['“Tôi cũng không dùng một từ này để bảo ly nhất định ngọt hơn. Muốn nói về lô nào thì cần biết lô ấy. Cái hay của chiếc tủ là mỗi ngăn vừa mở một chuyện, vừa cho mình thấy còn thiếu chuyện gì.”','“I won’t use that word to guarantee a sweeter cup. To discuss a lot, we need that lot’s details. Every drawer opens a story and shows what is still missing.”']],
 answer:['“Không cần cho câu chuyện này. Honey đang chỉ cách sơ chế, không phải món thêm vào. Nếu bạn thích uống với mật ong thì đó là một lựa chọn pha chế khác.”','“Not for this story. Honey names the processing, not an added ingredient. Adding honey to a drink is a separate choice.”'],
 facts:[['Honey processing không có nghĩa là thêm mật ong.','Honey processing does not mean adding honey.'],['Lớp nhầy và quy trình làm khô cần được mô tả cụ thể theo lô.','Mucilage retention and drying should be described for the particular lot.'],['Tên sơ chế không bảo đảm độ ngọt cảm nhận.','A process name does not guarantee perceived sweetness.']],
 invitation:['“Thử xếp hành trình sơ chế, hoặc tìm những đôi thẻ trên bàn? Xong hay chưa tôi vẫn kể nốt chuyện chiếc thìa.”','“Arrange the processing journey, or find the card pairs? I’ll finish the spoon story whether you play or not.”'],
 ending:['Chủ quán treo chiếc thìa cạnh thẻ Honey, thêm một dòng: “Không phải nguyên liệu.” Camila cười. “Đồ trưng bày cũng có thể giữ lại một lần mình đã hiểu ra.”','The owner hangs the spoon beside Honey with a note: “Not an ingredient.” Camila laughs. “An exhibit can preserve a moment of understanding too.”'],
 teaser:['Một công thức chia 40% và 60%, nhưng không phải hai loại hạt.','A recipe split into 40% and 60%, not two coffees.'],modes:['clue','order','memory'],
 quiz:{question:['Honey trên nhãn hôm nay nói về gì?','What does Honey describe on today’s label?'],choices:[['Phương pháp sơ chế','Processing method'],['Một phụ gia bắt buộc','A required additive'],['Lượng đường đo trong tách','Measured sugar in the cup']],correct:0,explanation:['Đây là thuật ngữ sơ chế; không khẳng định có mật ong hay một độ ngọt đo được.','It is a processing term, not proof of honey or a measured sweetness.']},
 order:[['Tách vỏ quả','Depulp the cherry'],['Giữ một phần lớp nhầy để làm khô','Retain some mucilage during drying'],['Xử lý hạt khô để chuẩn bị rang','Prepare dried seeds for roasting']],pairs:[['Vỏ quả','Fruit skin'],['Lớp nhầy','Mucilage'],['Hạt khô','Dried seed']],symbols:['◯','◌','●']
 },
 {
 id:'s1-kasuya',title:['Hai phần của cùng một bình nước','Two parts of the same water'],kind:'recipe',item:['Tetsu Kasuya · 4:6 Method','Tetsu Kasuya · 4:6 Method'],place:['20 g cà phê / 300 g nước','20 g coffee / 300 g water'],color:'#92ab9c',sources:['kasuya'],referenceId:'kasuya-four-six-v1',
 guest:{name:'Minji Park',origin:['Hàn Quốc · Châu Á','South Korea · Asia'],portrait:4,line:['“4:6 là tỷ lệ cà phê với nước à?”','“Is 4:6 the coffee-to-water ratio?”']},
 arrival:['Chủ quán chia mười chiếc cúc áo thành hai nhóm bốn và sáu. “Tôi không đổi nghề làm thợ may đâu. Hôm nay mình nhìn một phương pháp pha bằng thứ dễ đếm hơn.”','The owner divides ten buttons into groups of four and six. “I haven’t become a tailor. Today we’ll look at a brew method using something easier to count.”'],
 acquisition:['“Tôi tìm thấy hướng dẫn 4:6 của Tetsu Kasuya trong video Hario sau giờ đóng cửa. Ngồi tính phần trăm mãi, tôi lấy cúc áo ra đếm; sáng nay Minji thấy thế liền cho mượn thêm cả hộp. Thế là quán có một bộ minh họa hơi kỳ lạ.”','“I found Tetsu Kasuya’s 4:6 guide in a Hario video after closing. I took out buttons to make the percentages tangible; this morning Minji lent me a whole box. Now the café has an unusual teaching kit.”'],
 story:[['“Mẫu cơ bản ở đây là 20 g cà phê, 300 g nước, năm lần 60 g, bắt đầu cách nhau 45 giây. Bốn phần mười đầu là 120 g; sáu phần mười sau là 180 g. 4:6 không phải 4 g cà phê với 6 g nước.”','“This base example uses 20 g coffee, 300 g water, five 60 g pours starting 45 seconds apart. The first four tenths are 120 g; the remaining six tenths are 180 g. It is not 4 g coffee to 6 g water.”'],['“Tác giả dùng phần đầu để điều chỉnh cân bằng ngọt/chua, phần sau để điều chỉnh độ đậm theo phương pháp. Tôi giữ đó là lời hướng dẫn của tác giả, không biến nó thành định luật cho mọi hạt. Đồng hồ riêng có đủ năm nhịp; bàn luyện ba nhịp không giả vờ làm thay.”','“The method uses the first part for sweet/acid balance and the later part for strength. I keep that as the author’s guidance, not a law for every coffee. The dedicated timer has five pours; the three-stage station does not pretend to replace it.”']],
 answer:['“Không, đó là cách chia tổng nước của phương pháp. Tỷ lệ cà phê:nước của mẫu 20/300 là 1:15.”','“No, it divides the method’s total water. The example’s coffee-to-water ratio is 20:300, or 1:15.”'],
 facts:[['40% của 300 g là 120 g; 60% là 180 g.','40% of 300 g is 120 g; 60% is 180 g.'],['Mẫu cơ bản có năm lần 60 g, bắt đầu cách nhau 45 giây.','The base example has five 60 g pours, starting 45 seconds apart.'],['Chỉ dẫn điều chỉnh cảm quan thuộc phương pháp, không phải quy luật chung.','The sensory adjustment guidance belongs to the method, not a universal rule.']],
 invitation:['“Đếm thử hai nhóm nước hay sắp lại những mốc đầu tiên nhé? Muốn pha thật thì tôi mở đúng trang năm nhịp cho bạn.”','“Count the two water groups or arrange the early milestones? For a real brew I’ll open the correct five-pour page.”'],
 ending:['Mười chiếc cúc được cất trong túi riêng dưới trang công thức. “Tên phương pháp dễ nhớ nhất khi mình hiểu nó đang chia cái gì.” Minji đẩy hai nhóm lại gần nhau: vẫn chỉ là một tổng nước.','The buttons go into a pouch under the recipe. “A method’s name is easier to remember when we know what it divides.” Minji brings the groups together: still one total amount of water.'],
 teaser:['Một giống mang tên Bourbon, không phải một chai rượu.','A variety called Bourbon, without a bottle of whiskey.'],modes:['clue','order','memory'],
 quiz:{question:['40% tổng nước 300 g là bao nhiêu?','How much is 40% of 300 g input water?'],choices:[['40 g','40 g'],['120 g','120 g'],['180 g','180 g']],correct:1,explanation:['300 × 0,4 = 120 g; phần còn lại là 180 g.','300 × 0.4 = 120 g; the remainder is 180 g.']},
 order:[['Lần 1 ở 0:00, tổng 60 g','Pour 1 at 0:00, 60 g total'],['Lần 2 ở 0:45, tổng 120 g','Pour 2 at 0:45, 120 g total'],['Lần 3 ở 1:30, tổng 180 g','Pour 3 at 1:30, 180 g total']],pairs:[['40% · 120 g','40% · 120 g'],['60% · 180 g','60% · 180 g'],['Tổng · 300 g','Total · 300 g']],symbols:['◔','◕','●']

 {
 id:'s1-bourbon',title:['Túi hạt không có chai rượu','The bag without a whiskey bottle'],kind:'bean',item:['Guatemala · giống Bourbon','Guatemala · Bourbon variety'],place:['Guatemala','Guatemala'],color:'#b37f63',sources:['bourbon'],
 guest:{name:'Elena García',origin:['Tây Ban Nha · Châu Âu','Spain · Europe'],portrait:6,line:['“Bourbon ở đây là hương liệu rượu sao?”','“Does Bourbon here mean whiskey flavoring?”']},
 arrival:['Chủ quán úp hai chiếc ly nhỏ, lấy chỗ cho túi Guatemala. “Hôm nay lại có một cái tên dễ khiến mình đi nhầm quầy. Không có chai rượu nào trong kiện này.”','The owner clears two little glasses for a Guatemalan bag. “Another name that could send us to the wrong counter. There’s no whiskey bottle in this parcel.”'],
 acquisition:['“Ở buổi trao đổi mẫu, tôi mang hai tấm bưu thiếp tự vẽ để đổi lấy phần Bourbon từ Guatemala này. Người nhận chọn bức cửa quán bị vẽ lệch. Cả túi hạt lẫn bức tranh đều có tên dễ khiến người ta hỏi lại; thế là trao đổi lâu hơn dự định.”','“At a sample exchange, I traded two hand-drawn postcards for this Guatemalan Bourbon. The other person chose my crooked drawing of the café door. Both bag and picture invited questions, so the exchange took much longer than planned.”'],
 story:[['“Bourbon là một giống Arabica, có hồ sơ trong danh mục WCR. Tên này có liên hệ lịch sử với đảo Bourbon, nay là Réunion. Túi được giới thiệu hôm nay ghi nơi trồng Guatemala; hai thông tin không mâu thuẫn nhau.”','“Bourbon is an Arabica variety listed by WCR. Its name has historical links to Bourbon island, now Réunion. Today’s illustrative bag lists Guatemala as its growing country; those facts do not conflict.”'],['“Tôi muốn chiếc tủ giúp mình đọc rõ một cái nhãn, chứ không dạy một danh sách tính từ để học thuộc. Biết giống này không khiến mình có quyền bảo người bên cạnh phải nếm giống mình.”','“I want the cabinet to help us read labels, not memorize adjectives. Knowing a variety never gives us permission to tell a neighbor what they must taste.”']],
 answer:['“Đây là tên giống. Nếu có xử lý với nguyên liệu hay hương liệu khác thì phải có thông tin riêng; không được suy ra chỉ từ chữ Bourbon.”','“Here it is a variety name. Any added ingredient or flavoring would need separate information; we cannot infer it from Bourbon.”'],
 facts:[['Bourbon là một giống Arabica.','Bourbon is an Arabica variety.'],['Tên giống không đồng nghĩa thành phần rượu hay hương liệu.','A variety name does not imply whiskey or flavoring.'],['Nơi trồng hiện tại có thể khác địa danh trong lịch sử giống.','A growing location can differ from places in the variety’s history.']],

 ending:['Elena viết “Giống” trước chữ Bourbon bằng nét nhỏ. Chủ quán cười: “Đôi khi thêm đúng một từ làm cả câu chuyện rõ hơn.”','Elena adds “Variety” before Bourbon in small writing. The owner smiles. “Sometimes one accurate word makes the whole story clearer.”'],

 guest:{name:'Ella Wilson',origin:['Úc · Châu Đại Dương','Australia · Oceania'],portrait:6,line:['“Nếu cùng dùng giấy lọc thì đổi phễu có còn đáng ghi không?”','“If both use paper, is a change of dripper still worth recording?”']},

 acquisition:['“Tôi đặt chiếc ORIGAMI sau khi thấy nó ở quầy một người bạn. Mang về, việc đầu tiên không phải pha ngay mà là tìm giấy và đế đỡ phù hợp. Đẹp thôi chưa có nghĩa là bộ đồ đã sẵn sàng.”','“I ordered this ORIGAMI after seeing one at a friend’s counter. At home I first found suitable paper and a holder, rather than brewing immediately. Beautiful doesn’t mean ready to use.”'],
 story:[['“Gân của phễu trông như nếp giấy gấp. Hãng có hướng dẫn lựa chọn giấy và phụ kiện cho các mẫu của họ; tôi không dùng vẻ ngoài để khẳng định mọi loại giấy đều giống nhau.”','“Its ribs resemble folded paper. The maker provides paper and accessory guidance for its models; appearance is no reason to treat every filter as equivalent.”'],['“Nếu muốn so ly này với V60, mình phải ghi cả loại phễu và giấy. Thay hai thứ một lúc vẫn có thể pha một ly mình thích; chỉ là không nên gọi đó là chứng minh riêng một thứ đã làm đổi vị.”','“To compare with V60, record both brewer and paper. Changing two things can still make a cup we enjoy; it just doesn’t isolate which change caused a difference.”']],

 facts:[['Hình dáng, giấy lọc và đế đỡ cần tương thích với mẫu dụng cụ.','Shape, paper and holder need to suit the brewer model.'],['Ghi cả dụng cụ và loại giấy khi đối chiếu.','Record brewer and paper when comparing.'],['Đổi nhiều yếu tố không tách được nguyên nhân của từng yếu tố.','Changing several factors does not isolate individual causes.']],

 ending:['Chủ quán vẽ bóng chiếc phễu lên thẻ sưu tập. “Có món đồ làm mình muốn nhìn kỹ hơn. Thế đã là một khởi đầu tốt; chưa cần gọi nó là tốt nhất.”','The owner sketches the dripper’s shadow on its card. “Some objects make us look more closely. That’s a good beginning without calling them the best.”'],

 acquisition:['“Tôi ghé một buổi giới thiệu cà phê Brazil, định chỉ xin mẫu nhỏ. Rốt cuộc thứ khiến mình quay lại bàn là tấm ảnh quả chín vàng cạnh túi Yellow Bourbon. Tôi xin phép giữ bản ảnh giới thiệu, vì chụp mỗi hạt rang thì mất câu chuyện này.”','“I stopped by a Brazilian coffee introduction intending to request a small sample. A photo of yellow cherries beside Yellow Bourbon brought me back to the table. I asked to keep the introductory picture: a roasted-seed photo would miss this story.”'],
 story:[['“Cà phê có những giống và biến thể có màu quả chín khác nhau. Chữ Yellow trong tên này nói đến quả vàng, không đưa cho mình một thang đo mức rang. Hạt trong túi đã đi qua nhiều bước sau khi rời cây.”','“Coffee varieties and variants can have different ripe-cherry colors. Yellow in this name refers to yellow fruit, not a roast-level measurement. The seed has passed through many steps after leaving the tree.”'],['“Mình đã gặp Bourbon ở ngăn Guatemala. Quay lại tên quen trong một bối cảnh mới giúp tôi nhớ thế giới cà phê không phải mỗi nước một giống, mỗi giống một vị. Chiếc tủ đang bắt đầu nối các ngăn với nhau.”','“We met Bourbon in the Guatemala drawer. Meeting a familiar name in a new setting reminds us that coffee isn’t one variety per country or one flavor per variety. The drawers are beginning to connect.”']],

 guest:{name:'Sofia Almeida',origin:['Bồ Đào Nha · Châu Âu','Portugal · Europe'],portrait:1,line:['“15/250 là nửa 30/500, vậy mọi bước cũng chia đôi được chứ?”','“15/250 is half of 30/500. Can every step be halved too?”']},
 arrival:['Chủ quán lấy bình lớn ra rồi lại cất đi, chỉ để một chiếc tách. “Hôm nay tôi pha cho một người. Một thay đổi nhỏ đủ để mở một trang công thức khác.”','The owner brings out the large server, then puts it away, leaving one cup. “Today I’m brewing for one. A small change is enough to open another recipe page.”'],
 acquisition:['“Một sáng quán chỉ có tôi và một người khách. Tôi lật trang Ultimate, định chia đôi tất cả rồi nhận ra mình đang trả lời câu hỏi chưa hề thử. Thế là tôi tìm thêm A Better 1 Cup V60 của Hoffmann và kẹp thành trang riêng, cạnh chiếc tách hôm đó.”','“One morning the café held only me and one guest. I opened Ultimate and was about to halve everything, then realized I was answering a question I had not tried. I found Hoffmann’s A Better 1 Cup V60 and gave it a separate page beside that morning’s cup.”'],
 story:[['“Mẫu này là 15 g cà phê, 250 g nước, năm block 50 g. Sau bloom chờ tới 0:45, các lần rót tiếp xen thời gian chờ. Tổng là như nhau về tỷ lệ với 30/500, nhưng cách tổ chức dòng nước đã khác.”','“This example uses 15 g coffee, 250 g water, in five 50 g blocks. After the bloom wait to 0:45, later pours alternate with waits. The ratio matches 30/500, but the water delivery differs.”'],['“Bản tóm tắt chúng ta có ghi mốc gần 2:00. Tính lịch 10 giây rót, 10 giây chờ từ 0:45 thì lần cuối xong 1:55; tôi ghi rõ chỗ này trong hướng dẫn thay vì sửa lén. Khoảng 3:00 rút xong vẫn chỉ là mốc tham khảo.”','“Our summary gives a milestone near 2:00. Counting 10-second pours and waits from 0:45 ends the last at 1:55; I mark that uncertainty rather than silently changing it. Around 3:00 drawdown remains a reference.”']],
 answer:['“Lượng có thể chia đôi, nhưng không được giả định dòng chảy, độ sâu lớp bột và thời gian đều chia đôi theo. Muốn thử phương pháp một ly thì mình đọc đúng phương pháp một ly.”','“Amounts can be halved, but flow, bed depth and time don’t automatically halve with them. For the one-cup method, read the one-cup method.”'],
 facts:[['15/250 và 30/500 cùng tỷ lệ 1:16,67 xấp xỉ.','15/250 and 30/500 share a ratio of about 1:16.67.'],['Phương pháp một ly có năm block 50 g, không phải ba nhịp của Ultimate.','The one-cup method has five 50 g blocks, not Ultimate’s three water stages.'],['Lịch 1:55 và mốc gần 2:00 còn cần transcript gốc để đối chiếu.','The 1:55 schedule and near-2:00 milestone still need an original transcript check.']],
 invitation:['“Thử tìm tổng trên cân sau từng block hoặc sắp ba mốc đầu nhé. Muốn thực hành thì mở đồng hồ năm lần rót riêng.”','“Find the scale total after each block or arrange the first milestones. For practice, open the dedicated five-pour clock.”'],
 ending:['Sofia đặt hai trang Hoffmann cạnh nhau. Chủ quán dùng hai chiếc kẹp khác màu. “Cùng tác giả không có nghĩa cùng giao thức. Sưu tầm công thức cũng là giữ được những khác biệt nhỏ ấy.”','Sofia puts the Hoffmann pages side by side. The owner uses two different clips. “One author doesn’t mean one protocol. Collecting recipes means preserving those differences.”'],
 teaser:['Ngăn cuối: một giống lai, và tấm bưu thiếp che từ buổi đầu.','The final drawer: a hybrid and the postcard hidden since your first visit.'],modes:['clue','order','memory'],

 id:'s1-pacamara',title:['Tấm bưu thiếp trong ngăn thứ mười bốn','The postcard in drawer fourteen'],kind:'bean',item:['El Salvador · Pacamara','El Salvador · Pacamara'],place:['El Salvador','El Salvador'],color:'#a7a36c',sources:['pacamara'],
 guest:{name:'Dara Sok',origin:['Campuchia · Châu Á','Cambodia · Asia'],portrait:0,line:['“Một hạt to hơn có nghĩa là một ly ngon hơn không?”','“Does a larger bean mean a better cup?”']},
 arrival:['Tấm bưu thiếp che ngăn cuối đã được lật xuống. Chủ quán đặt túi Pacamara lên bàn. Mặt sau tấm thiếp chỉ có một dòng: “Chừa chỗ cho câu chuyện chưa biết.”','The postcard over the final drawer is turned down. The owner places Pacamara on the table. Its back reads: “Leave room for a story you don’t know yet.”'],
 acquisition:['“Tôi giữ mẫu Pacamara này cho lượt cuối. Một người bạn giới thiệu nó cùng hồ sơ giống, chứ không chỉ một bức ảnh hạt lớn. Mười bốn ngăn không đủ chứa thế giới cà phê; tôi muốn ngăn cuối nhắc mình điều đó.”','“I saved this Pacamara sample for the last visit. A friend introduced it with a variety profile, not merely a photograph of large beans. Fourteen drawers cannot hold the coffee world; the last should remind us of that.”'],
 story:[['“Pacamara được phát triển từ phép lai Pacas và Maragogipe tại El Salvador. Hồ sơ WCR giúp mình tìm lại câu chuyện giống. Hình dáng hạt có thể khiến mình chú ý, nhưng không phải thước đo sở thích hay chất lượng của một ly.”','“Pacamara was developed from a Pacas and Maragogipe cross in El Salvador. WCR’s profile helps trace that variety story. Bean appearance may catch our attention, but is not a measure of cup quality or personal liking.”'],['“Nhớ ngăn đầu chứ? Mình đã hỏi Mocha là gì. Rồi hỏi giống khác xuất xứ ra sao, cân đếm thứ gì, vì sao một công thức cần tên tác giả. Tôi sưu tầm những món này để có cớ cùng bạn ngồi xuống và hỏi thêm, không phải để lấp kín chiếc tủ rồi hết chuyện.”','“Remember the first drawer? We asked what Mocha meant. Then how variety differs from origin, what a scale counts, why a recipe needs its author. I collect these things so we can sit and ask more, not fill a cabinet and run out of stories.”']],
 answer:['“Không. Kích thước không tự quyết định chất lượng hay việc bạn có thích ly đó. Hôm nay điều đáng mang về là câu hỏi, không phải bảng xếp hạng hạt.”','“No. Size alone determines neither quality nor whether you enjoy a cup. Today’s keepsake is a question, not a bean ranking.”'],

function tastingProfile(episodeId){
 const e=cafeSeasonEpisodes.find(x=>x.id===episodeId);if(!e)return null;
 const reference=e.referenceId?recipeReference(e.referenceId):null;
 const method=e.tool==='aeropress'?'aeropress':e.tool==='origami'?'origami':'v60';
 let dose=15,water=240,targets=[30,150,240];
 if(reference){dose=reference.dose;water=reference.waterGrams;targets=e.referenceId==='hoffmann-ultimate-v60-v1'?[60,300,500]:e.referenceId==='hoffmann-one-cup-v60-v1'?[50,100,150,200,250]:[60,120,180,240,300];}
 if(method==='aeropress'){water=225;targets=[225];}
 return {episodeId,method,dose,water,targets,referenceId:reference?.id||null,protocol:reference?.id||(method==='aeropress'?'c6s-aeropress-15-225-v1':'c6s-pourover-15-240-v1'),title:e.item,prepare:e.quiz};
}
function tastingWaitQuestion(episodeId,focus){
 const p=tastingProfile(episodeId);if(!p)return null;
 if(p.method==='aeropress')return {question:['Khi ép, nước chuyển từ buồng xuống cốc. Cả bộ vẫn trên cân: số cân phải thế nào?','While plunging, water moves from chamber to cup. The whole setup stays on the scale: what should the reading do?'],choices:[['Giảm về 0','Fall to zero'],['Giữ tổng nước đã rót','Keep the cumulative water input'],['Tăng gấp đôi','Double']],correct:1,explanation:['Đúng: chuyển nước trong cùng bộ pha không phải thêm hay lấy nước ra khỏi cân. Game không đo áp suất hoặc lượng nước bột giữ lại.','Moving water within the same setup does not add or remove mass from the scale. The game does not measure pressure or water retained by grounds.']};
 if(focus==='flow')return {question:['Vừa ngừng rót mà cà phê vẫn nhỏ xuống. Bạn muốn nhìn điều gì trên cân?','You stopped pouring but coffee still drips. What would you watch on the scale?'],choices:[['Số cân phải giảm theo giọt','The reading must fall with each drop'],['Tổng nước giữ nguyên trong cùng bộ pha','Input stays unchanged within the setup'],['Số cân phải tăng dù không thêm nước','The reading must rise without more water']],correct:1,explanation:['Giọt đang chuyển từ phễu xuống bình; cả bộ vẫn trên cân. Thả tay đổi dòng nước, không lấy nước khỏi bộ pha.','The drops move from filter to server; both remain on the scale. Releasing changes the flow without removing water from the setup.']};
 const start=p.targets[0],next=p.targets[1],added=next-start;
 return {question:[`Cân đang ở ${start} g*. Muốn đạt tổng ${next} g*, bạn rót thêm bao nhiêu?`,`The scale reads ${start} g*. To reach ${next} g* total, how much more do you add?`],choices:[[`${next} g*`,`${next} g*`],[`${added} g*`,`${added} g*`],[`${p.water} g*`,`${p.water} g*`]],correct:1,explanation:[`${next} − ${start} = ${added} g*. Mốc trên cân là tổng tích lũy, không phải lượng rót thêm.`,`${next} − ${start} = ${added} g*. A scale target is cumulative, not the amount to add.`]};
}
function newTasting(episodeId,role='self'){
 if(!tastingProfile(episodeId)||!['self','watch'].includes(role))throw Error('Unknown café tasting');
 return {ritualVersion:2,focus:'flow',manualPauses:0,version:1,protocol:tastingProfile(episodeId).protocol,episodeId,role,sample:episodeId==='s1-yirgacheffe'?'washed':'default',phase:'prepare',stage:0,water:0,collected:0,elapsed:0,pourSeconds:0,waitSeconds:0,plunge:0,answers:{prepare:null,wait:null},assisted:{prepare:false,wait:false}};
}
function tastingAct(s,action){
 const p=tastingProfile(s.episodeId);if(!p||s.phase==='finished')return s;
 if(action.type==='focus'&&s.ritualVersion===2&&s.phase==='prepare'&&['flow','scale','quiet'].includes(action.value))return {...s,focus:action.value};
 if(action.type==='rest'&&s.ritualVersion===2&&s.role==='self'&&['pour','press'].includes(s.phase)&&s.water>0)return {...s,manualPauses:Math.min(999,s.manualPauses+1)};
 if(action.type==='sample'&&s.phase==='prepare'&&s.episodeId==='s1-yirgacheffe'&&['washed','natural'].includes(action.value))return {...s,sample:action.value};
 if(action.type==='answer'){
  const key=action.key,q=key==='prepare'?p.prepare:key==='wait'?tastingWaitQuestion(s.episodeId,s.focus):null;
  const permitted=key==='prepare'&&s.phase==='prepare'||key==='wait'&&['pause','immerse'].includes(s.phase)&&s.stage===0;
  if(!q||!permitted||s.role!=='self'||!Number.isInteger(action.index)||action.index<0||action.index>=q.choices.length)return s;
  return {...s,answers:{...s.answers,[key]:action.index}};
 }
 if(action.type==='help'){
  const key=action.key;if(!(key==='prepare'&&s.phase==='prepare'||key==='wait'&&['pause','immerse'].includes(s.phase)&&s.stage===0))return s;
  return {...s,assisted:{...s.assisted,[key]:true}};
 }
 if(action.type==='start'&&s.phase==='prepare')return {...s,phase:'pour',assisted:{...s.assisted,prepare:s.role==='watch'||s.answers.prepare!==p.prepare.correct||s.assisted.prepare}};
 if(action.type==='next'&&s.phase==='pause')return {...s,phase:'pour',stage:s.stage+1,waitSeconds:0,assisted:{...s.assisted,wait:s.assisted.wait||s.stage===0&&(s.role==='watch'||s.answers.wait!==tastingWaitQuestion(s.episodeId,s.focus).correct)}};
 if(action.type==='next'&&s.phase==='immerse'&&s.waitSeconds>=3)return {...s,phase:'press',waitSeconds:0,assisted:{...s.assisted,wait:s.assisted.wait||s.role==='watch'||s.answers.wait!==tastingWaitQuestion(s.episodeId,s.focus).correct}};
 return s;
}
function tickTasting(s,flow,dt){
 if(!Number.isFinite(dt)||dt<0||dt>.1)throw Error('Invalid tasting timestep');
 if(s.phase==='prepare'||s.phase==='finished'||dt===0)return s;
 const p=tastingProfile(s.episodeId),active=s.role==='watch'||flow;
 const delivering=s.phase==='pour'&&active,pressing=s.phase==='press'&&active;
 const started=s.water>0||delivering;
 if(!started)return s;
 let next={...s,elapsed:s.elapsed+dt};
 if(delivering){const added=Math.min(p.targets[s.stage]-s.water,p.water/12*dt);next.water=s.water+added;next.pourSeconds=s.pourSeconds+added/(p.water/12);
  if(p.targets[s.stage]-next.water<.000001){next.water=p.targets[s.stage];if(next.water===p.water)next.pourSeconds=12;next.waitSeconds=0;next.phase=p.method==='aeropress'?'immerse':s.stage===p.targets.length-1?'drain':'pause';}
 }
 if(s.phase==='pause'||s.phase==='immerse')next.waitSeconds=s.waitSeconds+dt;
 if(pressing){next.plunge=Math.min(1,s.plunge+dt/4);next.collected=next.water*next.plunge;if(next.plunge>=1)next.phase='finished';}
 if(p.method!=='aeropress'){next.collected=Math.min(next.water,s.collected+p.water/18*dt);if(next.phase==='drain'&&next.water-next.collected<.001){next.collected=next.water;next.phase='finished';}}
 if(s.role==='watch'&&next.phase==='pause'&&next.waitSeconds>=2.5)next=tastingAct(next,{type:'next'});
 if(s.role==='watch'&&next.phase==='immerse'&&next.waitSeconds>=3)next=tastingAct(next,{type:'next'});
 return next;
}
function validTasting(s,episodeId){
 const p=tastingProfile(episodeId);if(!p||!s||s.version!==1||s.protocol!==p.protocol||s.episodeId!==episodeId||!['self','watch'].includes(s.role)||!['prepare','pour','pause','immerse','press','drain','finished'].includes(s.phase)||!Number.isInteger(s.stage)||s.stage<0||s.stage>=p.targets.length)return false;
 if(s.ritualVersion!==undefined&&(s.ritualVersion!==2||!['flow','scale','quiet'].includes(s.focus)||!Number.isInteger(s.manualPauses)||s.manualPauses<0||s.manualPauses>999))return false;
 if(s.ritualVersion===undefined&&(s.focus!==undefined||s.manualPauses!==undefined))return false;
 if(!(episodeId==='s1-yirgacheffe'?['washed','natural'].includes(s.sample):s.sample==='default'))return false;
 for(const k of ['water','collected','elapsed','pourSeconds','waitSeconds','plunge'])if(!Number.isFinite(s[k])||s[k]<0||s[k]>1e7)return false;
 if(s.water>p.targets[s.stage]+.000001||s.water<(p.targets[s.stage-1]||0)-.000001||s.collected>s.water+.000001||s.pourSeconds>s.elapsed+.000001||s.plunge>1)return false;
 for(const key of ['prepare','wait']){const q=key==='prepare'?p.prepare:tastingWaitQuestion(episodeId),a=s.answers?.[key];if(!(a===null||Number.isInteger(a)&&a>=0&&a<q.choices.length)||typeof s.assisted?.[key]!=='boolean')return false;}
 if(s.phase==='prepare'&&(s.stage!==0||s.water!==0||s.collected!==0||s.elapsed!==0||s.pourSeconds!==0||s.waitSeconds!==0||s.plunge!==0))return false;
 if(p.method==='aeropress'){
  if(['pause','drain'].includes(s.phase)||s.phase==='immerse'&&s.plunge!==0||['immerse','press','finished'].includes(s.phase)&&s.water!==p.water||Math.abs(s.collected-s.water*s.plunge)>.001)return false;
 }else if(['immerse','press'].includes(s.phase)||s.plunge!==0)return false;
 if(s.phase==='pause'&&(s.stage===p.targets.length-1||s.water!==p.targets[s.stage]))return false;
 if(['drain','finished'].includes(s.phase)&&(s.stage!==p.targets.length-1||s.water!==p.water))return false;
 if(s.phase==='finished'&&(Math.abs(s.collected-p.water)>.001||p.method==='aeropress'&&s.plunge!==1))return false;
 return true;
}

// Two bounded follow-ups to the first scale discovery. Existing tasting physics is unchanged.
const positionCaseId='scale-position-v1',postcardCaseId='bag-letter-v1';
function emptyDiscoveryTrail(){return {version:1,active:null,scale:null,postcard:null};}
const unique=(a,pool)=>Array.isArray(a)&&a.length<=pool.length&&new Set(a).size===a.length&&a.every(x=>pool.includes(x));
const context=a=>a&&typeof a.contextId==='string'&&a.contextId.length>0&&a.contextId.length<=240&&['self','watch'].includes(a.role);
const snapshot=e=>e&&['input','collected','seconds'].every(k=>Number.isFinite(e[k])&&e[k]>=0)&&Math.abs(e.input-225)<.001&&e.collected<=e.input;
function validPositionPair(a,b){return snapshot(a)&&snapshot(b)&&a.collected<60&&b.collected-a.collected>1&&b.collected<224.999&&b.seconds>a.seconds&&a.input===b.input;}
function validPosition(a){return context(a)&&a.caseId===positionCaseId&&['ready','recording','inspect','solved','interrupted'].includes(a.step)&&['whole','server'].includes(a.position)&&unique(a.placements,['whole','server'])&&typeof a.feedback==='boolean'&&(a.before===null||snapshot(a.before))&&(a.after===null||snapshot(a.after))&&(!['recording','inspect','solved'].includes(a.step)||a.before)&&(!['inspect','solved'].includes(a.step)||validPositionPair(a.before,a.after))&&(a.step!=='solved'||a.position==='server'&&a.placements.length===2);}
function validPostcard(a){return context(a)&&a.caseId===postcardCaseId&&['inspect','solved','interrupted'].includes(a.step)&&unique(a.seen,['washed','natural'])&&[null,'washed','natural'].includes(a.chosen)&&typeof a.feedback==='boolean'&&(a.step!=='solved'||a.chosen==='washed'&&a.seen.includes('washed'));}
function validDiscoveryTrail(t,hasLens){if(!t||t.version!==1||!(t.active===null||validPosition(t.active)||validPostcard(t.active)))return false;
 if(t.scale!==null&&(!validPosition(t.scale)||t.scale.step!=='solved'||t.scale.reward!=='postcard-fragment-v1'||!Number.isFinite(Date.parse(t.scale.completedAt))))return false;
 if(t.postcard!==null&&(!validPostcard(t.postcard)||t.postcard.step!=='solved'||t.postcard.reward!=='cafe-postcard-v1'||!Number.isFinite(Date.parse(t.postcard.completedAt))))return false;
 return !((t.active||t.scale||t.postcard)&&!hasLens||t.postcard&&!t.scale||t.active?.caseId===postcardCaseId&&!t.scale);
}
function followCaseFor(episodeId,store){if(!store.discovery)return null;if(episodeId==='s1-aeropress')return positionCaseId;if(episodeId==='s1-yirgacheffe'&&store.trail?.scale)return postcardCaseId;return null;}
function beginFollowCase(store,caseId,contextId,role){if(!context({contextId,role})||!store.discovery||![positionCaseId,postcardCaseId].includes(caseId)||caseId===postcardCaseId&&!store.trail?.scale)return store;const trail=store.trail||emptyDiscoveryTrail();const active=caseId===positionCaseId?{caseId,contextId,role,step:'ready',position:'whole',placements:[],before:null,after:null,feedback:false}:{caseId,contextId,role,step:'inspect',seen:[],chosen:null,feedback:false};return {...store,trail:{...trail,active}};}
const update=(store,active)=>({...store,trail:{...store.trail,active}});
function observeFollowCase(store,contextId,s){const a=store.trail?.active;if(!a||a.contextId!==contextId||a.role!==s.role||['solved','interrupted'].includes(a.step))return store;
 if(a.caseId===postcardCaseId)return s.episodeId==='s1-yirgacheffe'&&s.phase==='prepare'?store:update(store,{...a,step:'interrupted'});
 if(s.episodeId!=='s1-aeropress')return store;
 if(s.phase==='finished')return update(store,{...a,step:'interrupted'});
 const e={input:s.water,collected:s.collected,seconds:s.elapsed};
 if(a.step==='ready'&&s.phase==='press')return update(store,{...a,step:'recording',before:e});
 if(a.before&&(s.elapsed<a.before.seconds-.001||s.water<225-.001))return update(store,{...a,step:'interrupted'});
 if(a.step==='recording'&&s.phase==='press'&&s.collected>=60)return update(store,{...a,after:e,step:validPositionPair(a.before,e)?'inspect':'interrupted'});
 return store;
}
function selectScalePosition(store,position){const a=store.trail?.active;if(a?.caseId!==positionCaseId||a.step!=='inspect'||!['whole','server'].includes(position))return store;return update(store,{...a,position,placements:[...new Set([...a.placements,position])],feedback:false});}
function completePositionCase(store,now=new Date().toISOString()){const a=store.trail?.active;if(a?.caseId!==positionCaseId||a.step!=='inspect'||!a.placements.includes('whole')||!a.placements.includes('server'))return store;if(a.position!=='server')return update(store,{...a,feedback:true});if(!Number.isFinite(Date.parse(now)))throw Error('Invalid time');const solved={...a,step:'solved'};return {...store,trail:{...store.trail,active:solved,scale:store.trail.scale||{...solved,reward:'postcard-fragment-v1',completedAt:now}}};}
function inspectPostcardBag(store,bag){const a=store.trail?.active;if(a?.caseId!==postcardCaseId||a.step!=='inspect'||!['washed','natural'].includes(bag))return store;return update(store,{...a,seen:[...new Set([...a.seen,bag])],chosen:bag,feedback:false});}
function completePostcardCase(store,now=new Date().toISOString()){const a=store.trail?.active;if(a?.caseId!==postcardCaseId||a.step!=='inspect'||!a.seen.includes(a.chosen))return store;if(a.chosen!=='washed')return update(store,{...a,feedback:true});if(!Number.isFinite(Date.parse(now)))throw Error('Invalid time');const solved={...a,step:'solved'};return {...store,trail:{...store.trail,active:solved,postcard:store.trail.postcard||{...solved,reward:'cafe-postcard-v1',completedAt:now}}};}
function abandonFollowCase(store,contextId){const a=store.trail?.active;return a?.contextId===contextId?update(store,{...a,step:'interrupted'}):store;}

 const vi=lang==='vi',tx=(x,y)=>vi?x:y;

function followJournalMarkup(trail,lang='vi'){if(!trail)return '';const vi=lang==='vi';return `${trail.scale?`<article class="trail-journal"><h3>${followCaseTitle(positionCaseId,lang)}</h3>${cafePostcardArt(lang,true)}<p>${vi?'AeroPress · dấu vết đã lưu khi tạm giữ lúc ép':'AeroPress · saved evidence at a paused plunge'}: ${trail.scale.after.input.toFixed(1)} g* / ${trail.scale.after.collected.toFixed(1)} g* (${vi?'cả bộ / chỉ cốc':'whole setup / cup only'}).</p><p>${vi?'Đã thử hai vị trí và chọn cách cân phần trong cốc. Không phải số đo áp suất hay vị thật.':'Both placements tried; chose how to weigh the contents of the cup. Not a pressure or taste measurement.'}</p></article>`:''}${trail.postcard?`<article class="trail-journal"><h3>${vi?'Bưu thiếp tìm được đường về':'The postcard found its way home'}</h3>${cafePostcardArt(lang)}<p>Ethiopia · WASHED · ${vi?'chọn theo nhãn minh họa, không suy đoán vị':'chosen from illustrative labels, without predicting flavor'}.</p><p>${vi?'Ba manh mối đã trọn. Bưu thiếp được ghim trong quán; chưa có nhiệm vụ thứ tư trong chuỗi này.':'All three clues are complete. The postcard is pinned in the café; this chain has no fourth quest yet.'}</p></article>`:''}`;}

// A bounded observation case, not a new extraction or sensory model.
const discoveryCaseKey='c6s.discovery-lab.v1';
const scaleCaseId='still-scale-v1';
function emptyDiscoveryLab(){return {version:1,attempt:null,discovery:null};}
const caseChoices=['rise','fall','steady'];
function scaleEvidence(s){return {input:s.water,collected:s.collected,seconds:s.elapsed};}
function validEvidence(e){return !!e&&['input','collected','seconds'].every(k=>Number.isFinite(e[k])&&e[k]>=0)&&Math.abs(e.input-30)<.001&&e.collected<=e.input+.001;}
function supportsScaleDiscovery(before,after){return validEvidence(before)&&validEvidence(after)&&Math.abs(after.input-before.input)<.001&&after.collected-before.collected>.1&&after.seconds-before.seconds>=.2;}
function validAttempt(a){
 if(!a||a.caseId!==scaleCaseId||typeof a.contextId!=='string'||!a.contextId||a.contextId.length>240||!['self','watch'].includes(a.role)||!caseChoices.includes(a.prediction)||!['ready','rest','observing','evidence','solved','interrupted'].includes(a.step))return false;
 if(!(a.conclusion===null||caseChoices.includes(a.conclusion))||![null,.25,1].includes(a.wait)||!(a.before===null||validEvidence(a.before))||!(a.after===null||validEvidence(a.after)))return false;
 if(['rest','observing','evidence','solved'].includes(a.step)&&!a.before)return false;
 if(['observing','evidence','solved'].includes(a.step)&&a.wait===null)return false;
 if(['evidence','solved'].includes(a.step)&&!supportsScaleDiscovery(a.before,a.after))return false;
 if(a.step==='solved'&&a.conclusion!=='steady')return false;
 return true;
}
function loadDiscoveryLab(raw){
 if(raw===null)return {store:emptyDiscoveryLab(),writable:true};
 try{const s=JSON.parse(raw);if(s?.version!==1||!(s.attempt===null||validAttempt(s.attempt)))throw Error('Invalid case');
  const d=s.discovery;if(d!==null&&(!validAttempt(d)||d.step!=='solved'||d.reward!=='inspection-lens-v1'||!Number.isFinite(Date.parse(d.completedAt))))throw Error('Invalid discovery');
  if(s.trail!==undefined&&!validDiscoveryTrail(s.trail,!!s.discovery))throw Error('Invalid discovery trail');
  return {store:s,writable:true};
 }catch{return {store:emptyDiscoveryLab(),writable:false,raw};}
}
function beginScaleCase(store,contextId,role,prediction){
 if(typeof contextId!=='string'||!contextId||contextId.length>240||!['self','watch'].includes(role)||!caseChoices.includes(prediction))throw Error('Invalid case start');
 return {...store,attempt:{caseId:scaleCaseId,contextId,role,prediction,step:'ready',wait:null,before:null,after:null,conclusion:null}};
}
function observeScaleCase(store,contextId,s){
 const a=store.attempt;if(!a||a.contextId!==contextId||s.episodeId!=='s1-yemen'||s.role!==a.role||['solved','interrupted'].includes(a.step))return store;
 if(s.stage>0||s.phase==='finished'||s.water>30.001)return {...store,attempt:{...a,step:'interrupted'}};
 if(a.step==='ready'&&s.phase==='pause'&&s.stage===0){const before=scaleEvidence(s);return {...store,attempt:{...a,step:before.input-before.collected>.1?'rest':'interrupted',before}};}
 if(a.before&&(s.elapsed+.001<a.before.seconds||s.water+.001<a.before.input))return {...store,attempt:{...a,step:'interrupted'}};
 if(a.step==='observing'&&s.elapsed-a.before.seconds>=a.wait-.000001){const after=scaleEvidence(s);return {...store,attempt:{...a,after,step:supportsScaleDiscovery(a.before,after)?'evidence':'interrupted'}};}
 return store;
}
function waitForScaleEvidence(store,seconds){const a=store.attempt;if(!a||a.step!=='rest'||![.25,1].includes(seconds))return store;return {...store,attempt:{...a,step:'observing',wait:seconds}};}
function concludeScaleCase(store,choice,now=new Date().toISOString()){
 const a=store.attempt;if(!a||a.step!=='evidence'||!caseChoices.includes(choice))return store;
 const next={...a,conclusion:choice};if(choice!=='steady')return {...store,attempt:next};
 if(!Number.isFinite(Date.parse(now)))throw Error('Invalid completion time');next.step='solved';
 return {...store,attempt:next,discovery:store.discovery||{...next,completedAt:now,reward:'inspection-lens-v1'}};
}

function abandonScaleCase(store,contextId){const a=store.attempt;return a&&a.contextId===contextId?{...store,attempt:{...a,step:'interrupted'}}:store;}

const caseNumber=n=>(Math.round(n*10)/10).toFixed(1);
function readDiscoveryBook(){try{return loadDiscoveryLab(localStorage.getItem(discoveryCaseKey));}catch{return {store:emptyDiscoveryLab(),writable:false};}}
function nextDiscoveryLink(store,lang){if(!store.discovery||store.trail?.postcard)return '';const id=store.trail?.scale?'s1-yirgacheffe':'s1-aeropress',name=store.trail?.scale?'Ethiopia':'AeroPress',vi=lang==='vi';let visited=false;try{visited=loadCafeSeason(localStorage.getItem(cafeSeasonKey)).store.visits.some(v=>v.closed&&v.episodeId===id);}catch{}return visited?`<button id="discovery-open-next" class="secondary" data-episode="${id}">${vi?'Mở manh mối tiếp theo':'Open the next clue'} · ${name}</button>`:`<p class="trail-next-clue">${vi?'Manh mối tiếp theo đang chờ ở lượt':'The next clue waits in the'} ${name}${vi?'. Bạn cứ ghé theo nhịp của mình.':' visit. Come back at your own pace.'}</p>`;}

}
function caseChoiceLabel(choice,lang){return (lang==='vi'?{rise:'Tăng',fall:'Giảm',steady:'Giữ nguyên'}:{rise:'Rise',fall:'Fall',steady:'Stay steady'})[choice]||'—';}
function caseEvidenceTable(a,lang){const vi=lang==='vi';return `<table class="case-evidence"><caption>${vi?'Cùng 30 g* đầu vào · thời gian game':'Same 30 g* input · game time'}</caption><thead><tr><th>${vi?'Dấu vết':'Trace'}</th><th>${vi?'Ngay lúc dừng':'At release'}</th><th>${vi?'Sau nghỉ':'After rest'}</th></tr></thead><tbody><tr><th>${vi?'Trên cân':'Scale'}</th><td>${caseNumber(a.before.input)} g*</td><td>${caseNumber(a.after.input)} g*</td></tr><tr><th>${vi?'Đã xuống bình':'In server'}</th><td>${caseNumber(a.before.collected)} g*</td><td>${caseNumber(a.after.collected)} g*</td></tr></tbody></table>`;}

function createScaleDiscovery(){
 let loaded=readDiscoveryBook(),store=loaded.store,dirty=false,host,contextId,lang='vi',stateNow,refresh,dialog,inspection=false,eligible=false,episodeId='';
 const tx=(vi,en)=>lang==='vi'?vi:en;
 const attempt=()=>store.attempt?.contextId===contextId&&stateNow&&store.attempt.role===stateNow().role?store.attempt:null;
 const followId=()=>followCaseFor(episodeId,store);
 const followAttempt=()=>store.trail?.active?.contextId===contextId&&store.trail.active.role===stateNow?.().role&&store.trail.active.caseId===followId()?store.trail.active:null;
 function persist(){try{if(!loaded.writable)throw Error();localStorage.setItem(discoveryCaseKey,JSON.stringify(store));dirty=false;window.dispatchEvent(new Event('c6s-discovery-changed'));}catch{dirty=true;}}
 function write(next){if(next===store)return;store=next;persist();}
 function choices(attribute){return ['rise','fall','steady'].map(c=>`<button type="button" class="secondary" ${attribute}="${c}">${caseChoiceLabel(c,lang)}</button>`).join('');}
 function panel(){const a=attempt(),s=stateNow(),follow=followId(),fa=followAttempt();let content='';

  else if(!a||a.step==='interrupted')content=`<p>${tx('“Mình ngừng rót mà giọt vẫn xuống. Theo bạn, cân sẽ tăng, giảm hay giữ nguyên? Thử rồi hẵng kết luận nhé.”','“I stop pouring but the drops keep falling. Will the scale rise, fall or stay steady? Let’s test before deciding.”')}</p>${s.phase==='prepare'?`<div class="case-choices">${choices('data-case-predict')}</div>`:`<p>${tx('Lần quan sát này chưa đủ cặp dấu vết. Bạn cứ pha tiếp; lần pha lại có thể dự đoán và thử từ đầu.','This attempt has no complete evidence pair. Keep brewing; predict and try again on a fresh cup.')}</p>`}`;
  else if(a.step==='ready')content=`<p>${tx('Dự đoán của bạn','Your prediction')}: <strong>${caseChoiceLabel(a.prediction,lang)}</strong>.</p><p>${tx('Bắt đầu pha như thường. Đến mốc 30 g*, mình sẽ giữ nguyên đầu vào rồi chọn lúc nhìn lại.','Start brewing normally. At 30 g*, we’ll hold the input fixed and choose when to look again.')}</p>`;

  else content=`<p class="case-reveal">✧ ${tx('Bạn đã mở kính quan sát!','You unlocked the inspection lens!')}</p><p>${a.prediction==='steady'?tx('Bạn đã kiểm chứng dự đoán bằng hai dấu vết.','You checked your prediction against two traces.'):tx('Dự đoán đổi, phát hiện ở lại: giọt chuyển xuống bình, còn tổng trên cân giữ nguyên.','The prediction changed; the discovery stays: drops move into the server while the scale total stays steady.')}</p>${caseEvidenceTable(a,lang)}<p>${tx('Cả bộ vẫn trên cân, không thêm/bớt nước. Chuyển nước trong bộ không đổi khối lượng trên cân.','The whole setup stays on the scale with no water added or removed. Internal transfer leaves scale mass unchanged.')}</p><p>${tx('Một câu hỏi mang theo: nếu chỉ đặt bình lên cân, số có còn như cũ không?','A question to keep: if only the server sat on the scale, would its reading still behave the same way?')}</p><button id="case-use-lens">${tx('Nhìn qua kính','Look through the lens')}</button>`;
  return `<header><small>${eligible||follow?tx('CHỦ QUÁN · BƯU THIẾP','THE OWNER · POSTCARD')+' '+(follow===positionCaseId?'2':follow===postcardCaseId?'3':'1')+'/3':tx('CHỦ QUÁN · KÍNH QUAN SÁT','THE OWNER · INSPECTION LENS')}</small><button id="case-close" class="secondary">${tx('Về ly đang pha','Back to the cup')}</button></header><div class="case-dialog-body"><h2 id="case-title">${follow?followCaseTitle(follow,lang):eligible?tx('Giọt vẫn rơi… cân sẽ thế nào?','The drops keep falling… what about the scale?'):tx('Kính quan sát · ly hiện tại','Inspection lens · current cup')}</h2>${content}${(fa&&!['solved','interrupted'].includes(fa.step)||a&&['ready','rest','observing','evidence'].includes(a.step))?`<button id="case-leave" class="secondary">${tx('Bỏ điều tra · pha tiếp','Leave case · keep brewing')}</button>`:''}<details><summary>${tx('Điều kiện & giới hạn','Conditions & limits')}</summary><p>${tx('Cân đã trừ bì cả bộ pha. Game bỏ qua bay hơi, đổ tràn và lực tay lên cân; lượng chuyển và thời gian được minh họa, chưa mô phỏng nước bột giữ lại. g* và giây game không phải số đo pha thật. Không dự đoán hương vị.','The entire setup is tared. This illustration omits evaporation, spills, hand forces and grounds retention; transferred amount and game time are illustrative. g* and game seconds are not real-brew measurements. No flavor prediction.')}</p></details><p id="case-save-status" role="status">${dirty?tx('Chưa lưu được sổ khám phá; kết quả chỉ giữ trong phiên này.','Discovery is unsaved; this result is kept only in this session.'):!loaded.writable?tx('Sổ cũ chưa đọc được; không ghi đè dữ liệu gốc.','The old notebook is unreadable; original data is protected.'):''}</p>${dirty&&loaded.writable?`<button id="case-retry-save" class="secondary">${tx('Thử lưu khám phá','Retry saving discovery')}</button>`:''}${dirty||!loaded.writable?`<button id="case-export-session" class="secondary">${tx('Tải bản sao phiên này','Download session backup')}</button>`:''}</div>`;
 }
 function drawDialog(){if(!dialog)return;const focused=dialog.contains(document.activeElement)?document.activeElement?.getAttribute('data-case-conclude'):null;dialog.innerHTML=panel();dialog.querySelector('#case-close').onclick=()=>dialog.close();dialog.querySelector('#case-leave')?.addEventListener('click',()=>{write(followAttempt()?abandonFollowCase(store,contextId):abandonScaleCase(store,contextId));dialog.close();refresh(stateNow().phase==='prepare'?'hold':'run');});dialog.querySelector('#trail-start')?.addEventListener('click',()=>{if(stateNow().phase!=='prepare')return;const id=followId();write(beginFollowCase(store,id,contextId,stateNow().role));inspection=true;refresh('hold');if(id===postcardCaseId)drawDialog();else dialog.close();});dialog.querySelectorAll('[data-trail-position]').forEach(b=>b.onclick=()=>{write(selectScalePosition(store,b.dataset.trailPosition));refresh('hold');drawDialog();dialog.querySelector(`[data-trail-position="${b.dataset.trailPosition}"]`)?.focus({preventScroll:true});});dialog.querySelectorAll('[data-trail-bag]').forEach(b=>b.onclick=()=>{if(stateNow().phase!=='prepare')return;write(inspectPostcardBag(store,b.dataset.trailBag));refresh('sample',b.dataset.trailBag);drawDialog();dialog.querySelector(`[data-trail-bag="${b.dataset.trailBag}"]`)?.focus({preventScroll:true});});dialog.querySelector('#trail-confirm')?.addEventListener('click',()=>{if(followId()===postcardCaseId&&stateNow().phase!=='prepare')return;write(followId()===positionCaseId?completePositionCase(store):completePostcardCase(store));refresh('hold');drawDialog();});dialog.querySelector('#trail-done')?.addEventListener('click',()=>{dialog.close();refresh('hold');});dialog.querySelectorAll('[data-case-predict]').forEach(b=>b.onclick=()=>{if(stateNow().phase!=='prepare')return;write(beginScaleCase(store,contextId,stateNow().role,b.dataset.casePredict));dialog.close();refresh('hold');});dialog.querySelectorAll('[data-case-wait]').forEach(b=>b.onclick=()=>{write(waitForScaleEvidence(store,Number(b.dataset.caseWait)));dialog.close();refresh('run');});dialog.querySelectorAll('[data-case-conclude]').forEach(b=>b.onclick=()=>{write(concludeScaleCase(store,b.dataset.caseConclude));refresh('hold');drawDialog();});dialog.querySelector('#case-use-lens')?.addEventListener('click',()=>{inspection=true;dialog.close();refresh('hold');});dialog.querySelector('#case-retry-save')?.addEventListener('click',()=>{persist();drawDialog();refresh('hold');});dialog.querySelector('#case-export-session')?.addEventListener('click',()=>downloadDiscovery({kind:'game_discovery_session_backup',store,protectedRaw:loaded.raw??null},'c6s-discovery-session.json'));if(focused)dialog.querySelector(`[data-case-conclude="${focused}"]`)?.focus({preventScroll:true});}

 }

 }
 function facts(e,v,all=false){return `<div class="season-facts">${e.facts.map((f,i)=>{const open=all||v?.inspected.includes(i);return `<div class="season-fact">${open?`<span>${i+1}.</span><p>${at(f)}</p>`:`<button type="button" data-season-inspect="${i}" class="secondary">${tx('Xem thẻ','Inspect card')} ${i+1} ↗</button>`}</div>`;}).join('')}</div>`;}
 function evidence(e){return `<details class="season-evidence"><summary>${tx('Nguồn kiến thức & phần hư cấu','Knowledge sources & fiction')}</summary><p>${tx('Chủ quán, khách, kiện hàng và hành trình sưu tầm là hư cấu do C6S viết. Túi hạt là minh họa theo vùng/giống, không phải hồ sơ lô thương mại đã xác minh hay hàng thật của quán.','The owner, guests, parcels and collecting journeys are C6S fiction. Bags illustrate regions/varieties, not verified commercial lots or actual café stock.')}</p><ul>${e.sources.map(key=>{const source=cafeSeasonSources[key];return `<li><a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.title} ↗</a><small>${source.status==='user-provided-source-summary'?tx(' · theo bản tóm tắt xác minh người dùng cung cấp; nhóm làm game chưa trực tiếp xem video.',' · based on the user-supplied verification summary; the game team has not directly reviewed the video.'):tx(' · nguồn tham khảo nền; chưa kiểm tra trực tiếp nội dung nguồn trong lần cập nhật này.',' · background reference; source content has not been directly reviewed for this update.')}</small></li>`;}).join('')}</ul><p class="help">${tx('Không suy ra chất lượng hay vị chính xác chỉ từ xuất xứ, giống hoặc sơ chế. Không hàm ý nhà sản xuất hay barista bảo chứng cho C6S.','Origin, variety and processing do not establish exact flavor or quality. No maker or barista endorsement of C6S is implied.')}</p></details>`;}
 function cabinet(){return `<details class="season-cabinet"><summary>${tx('Chiếc tủ của chủ quán','The owner’s cabinet')} · ${store.visits.filter(v=>v.closed).length}/14</summary><div class="season-drawers">${episodes().map((e,i)=>{const v=store.visits[i];return `<button type="button" class="secondary ${v?.closed?'collected':''}" data-season-archive="${i}" ${!v?.closed?'disabled':''}><span>${String(i+1).padStart(2,'0')}</span><strong>${v?.closed?at(e.item):v?tx('Đang mở','Open now'):tx('Một món chờ được kể','A story waiting')}</strong>${v?.closed?`<small>${v.localDate}</small>`:''}</button>`;}).join('')}</div><p class="help">${tx('Nghe trọn câu chuyện là có thẻ. Không cần thắng trò chơi, ghé liên tục hay chờ đến ngày mai. Sổ chỉ lưu trên trình duyệt này.','Finish the story to keep its card. No game win, attendance streak or wait until tomorrow is required. The notebook is local to this browser.')}</p>${store.visits.length?actionButton('export','Tải sổ & câu chuyện','Download notebook & stories',true):''}</details>`;}

function firstRecipeChanges(before,after){

}
function firstExperimentPair(records,entry){

 const baseline=records.find(r=>r.id===entry.baselineId);
 if(!baseline)return {status:'missing-baseline'};
 const changed=firstRecipeChanges(baseline.recipe,entry.recipe);

}
function firstRadarPoints(axes){

function firstMemoryMatches(entry,query){

 const text=fold([entry.recipe.bean,firstPourBeans.find(b=>b.id===entry.recipe.bean)?.name,entry.feedback.notes,entry.feedback.nextChange,recipeReference(entry.recipe.referenceId)?.author,recipeReference(entry.recipe.referenceId)?.title].join(' '));

function firstShiftProgress(session,records){
