# Báo ngay khi có thay đổi tài liệu thiết kế hoặc ý tưởng mới được push lên main.
# Workflow chạy trên repo chứa file này (cần merge vào repo của sếp mới có tác dụng ở đó).
# Mở một issue có nhãn "design-update"; GitHub gửi thông báo cho người được giao.
# Đặt biến repo DESIGN_NOTIFY_ASSIGNEE (Settings → Secrets and variables → Actions → Variables)
# bằng tên GitHub của người cần báo. Không đặt thì issue vẫn được tạo, chỉ không giao cho ai.
name: design-notify

on:
  push:
    branches: [main]
    paths:
      - 'docs/design/**'
      - 'docs/screens/**'
      - 'docs/shared/**'
      - 'docs/game-flow.md'

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tóm tắt thay đổi
        id: summary
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$AFTER~1"; fi
          {
            echo "body<<EOF"
            echo "Push lên \`main\` bởi **${GITHUB_ACTOR}** chạm tài liệu thiết kế."
            echo
            echo "### Commit"
            git log --format='- %h %an: %s' "$base..$AFTER" -- docs/design docs/screens docs/shared docs/game-flow.md
            echo
            echo "### File"
            git diff --name-status "$base" "$AFTER" -- docs/design docs/screens docs/shared docs/game-flow.md | sed 's/^/- /'
            echo
            echo "### Ý tưởng mới"
            git diff --name-only --diff-filter=A "$base" "$AFTER" -- docs/design/ideas | grep -v -e README.md -e _template.md | sed 's/^/- /' || echo "- Không có"
            echo
            echo "Xử lý: đọc thay đổi, cập nhật bảng trạng thái GDD (mục 0) nếu cần, rồi đóng issue."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Mở issue
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.summary.outputs.body }}
          ASSIGNEE: ${{ vars.DESIGN_NOTIFY_ASSIGNEE }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Thiết kế cập nhật ${date} (${context.sha.slice(0, 7)})`,
              body: process.env.BODY,
              labels: ['design-update'],
              assignees: process.env.ASSIGNEE ? [process.env.ASSIGNEE] : [],
            });
