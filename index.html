<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9acd65" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&amp;family=Paytone+One&amp;display=swap" rel="stylesheet" />
    <title>GodBean: Build your own Coffee Empire!</title>
    <meta name="description" content="GodBean: Build your own Coffee Empire! Grow, roast and brew coffee, then run your own café." />
    <meta name="application-name" content="GodBean" />
    <meta name="apple-mobile-web-app-title" content="GodBean" />
    <style>
      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf5e7;color:#355342;font-family:'Baloo 2',system-ui,sans-serif}
      *,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
      /* Game, not a web page: no text selection / "Select all · Copy" callout on long-press or double-tap, no grey tap
         flash, no double-tap page zoom. Text fields (if any) stay selectable. */
      html{-webkit-text-size-adjust:100%;touch-action:manipulation}
      *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
      input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
      img,canvas,svg{-webkit-user-drag:none}
      /* Focus rings only for keyboard players (src/main.js sets data-input="key" on Tab / arrows): a tap must never
         leave a ring on a button or on the game view. */
      html:not([data-input="key"]) :focus{outline:none!important}
      body.booting > :not(#loading):not(#error){visibility:hidden}
      /* the static texts are written in one language in the HTML: hide them until src/main.js has translated them (no English flash) */
      html:not(.i18n-ready) #loading :is(small,#load-status,.loading-tip){visibility:hidden}
      /* Loading screen, in the play HUD's own look (src/ui/styles/v3.css): grass ground like the realm, one cream card
         (same as the HUD confirm card), a green "go" progress bar with the player's own character running on it
         (the player's own character model, see .ld-runner), 🫘 beans picked up on the way, dark-brown
         percent pill (like the coin / bean pills) and the white tip bubble. src/ui/loading.js drives --p and the beans. */
      .loading-screen{--ld-ink:#694427;--ld-cream:#fff8e6;position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:var(--ld-ink);font-family:'Baloo 2',system-ui,sans-serif;
        background:#6fd8ff url('%BASE_URL%assets/ui/sky.svg') center/cover no-repeat;transition:opacity .25s ease}
      .loading-screen.is-leaving{opacity:0;pointer-events:none}
      .loading-logo{display:grid;justify-items:center;margin:0 0 6px;color:#fff;font:400 clamp(44px,13vw,60px)/1.05 'Paytone One','Baloo 2',system-ui,sans-serif;text-shadow:-3px 0 #d9620a,3px 0 #d9620a,0 -3px #d9620a,0 3px #d9620a,-2px -2px #d9620a,2px -2px #d9620a,-2px 2px #d9620a,2px 2px #d9620a,0 5px 0 #7a4515}
      .loading-logo small{margin-top:6px;padding:2px 12px;border-radius:999px;background:#fffdf0;color:#7a4515;font:800 13px/1.5 'Baloo 2',system-ui,sans-serif;letter-spacing:.3px;text-shadow:none;-webkit-text-stroke:0}
      .ld-card{width:min(340px,100%);padding:16px 18px 14px;border:4px solid #7a4515;border-radius:24px;background:linear-gradient(#fffdf0,#fff3c0);box-shadow:0 6px 0 #7a4515,0 12px 24px #7a451533}
      .ld-road{position:relative;padding-top:0}
      #load-track{position:relative;height:22px;border-radius:999px;background:#e8dcc2;box-shadow:inset 0 2px 2px #0002}
      #load-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 1%);min-width:22px;border-radius:inherit;background:linear-gradient(#8cd45a,#5aab35);box-shadow:inset 0 -3px 0 #3e7f2266,inset 0 3px 0 #ffffff55}
      .ld-bean{position:absolute;top:50%;width:18px;margin:-10px 0 0 -9px;font-size:15px;line-height:20px;text-align:center;filter:drop-shadow(0 1px 0 #0003);transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .35s ease}
      .ld-bean.got{transform:translateY(-30px) scale(1.3);opacity:0}
      /* Runner: the player's own character (public/models girl.glb / male.glb) rendered from its "Running" clip into a
         10-frame sprite sheet (public/assets/loading/runner-*.png, 160×200 per frame), played with steps(). */
      .ld-runner{position:absolute;bottom:calc(100% - 8px);left:calc(var(--p,0) * 1%);width:84px;height:105px;margin-left:-42px;pointer-events:none}
      .ld-sprite{position:absolute;inset:0;background:url('%BASE_URL%assets/loading/runner-female.png') 0 0/840px 105px no-repeat;animation:ld-run .63s steps(10) infinite}
      .loading-screen[data-gender="male"] .ld-sprite{background-image:url('%BASE_URL%assets/loading/runner-male.png')}
      @keyframes ld-run{to{background-position:-840px 0}}
      .ld-shadow{position:absolute;left:50%;bottom:2px;width:34px;height:7px;margin-left:-17px;border-radius:50%;background:#3e2a1a;opacity:.22}
      .ld-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
      #load-status{min-width:0;overflow:hidden;color:var(--ld-ink);font:700 14px/1.3 'Baloo 2',system-ui,sans-serif;text-overflow:ellipsis;white-space:nowrap}
      #load-pct{flex:none;min-width:58px;padding:0 12px;border-radius:999px;background:linear-gradient(#7fe03a,#3fb51c);box-shadow:0 3px 0 #7a4515;color:#fff;font:800 16px/30px 'Baloo 2',system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
      .loading-tip{position:relative;display:flex;gap:8px;align-items:flex-start;width:min(340px,100%);margin:0;padding:10px 14px;border-radius:20px;background:#fff;box-shadow:0 4px 0 #a2763a40,0 8px 18px #4a32101f;color:var(--ld-ink);font:700 14px/1.35 'Baloo 2',system-ui,sans-serif}
      .loading-tip::before{content:'💡';flex:none;font-size:17px;line-height:19px}
      .loading-tip:empty{display:none}
      /* temporary logo: the letters db in a rounded brown tile */
      .ld-mark{display:grid;place-items:center;width:72px;height:72px;margin:0 0 -4px;border-radius:22px;width:132px;height:132px;background:url('%BASE_URL%assets/ui/bean.svg') center/contain no-repeat;color:transparent;font-size:0;box-shadow:none}
      /* simple loading: no runner, no beans, no tip, no patterned ground — just the logo, the bar and the percent */
      .ld-runner,#load-beans,.loading-tip{display:none!important}
      @media(prefers-reduced-motion:reduce){.ld-sprite{animation:none}}
    </style>
    <link rel="stylesheet" href="/src/ui/styles/game.css">
  </head>
  <body class="booting">
    <div id="game" tabindex="-1" aria-label="Màn 1: Tai nạn tại phố cổ Hà Nội" data-i18n-attr="aria-label:html.game.label"></div>
    <div class="vignette"></div>
    <section id="loading" class="loading-screen" aria-label="Đang tải trò chơi" data-i18n-attr="aria-label:html.loading.label">
      <div class="ld-mark" aria-hidden="true">db</div>
      <h1 class="loading-logo">GodBean<small data-i18n="html.tagline">Build your own Coffee Empire!</small></h1>
      <div class="ld-card">
        <div class="ld-road">
          <div id="load-track" role="progressbar" aria-label="Tiến trình tải" data-i18n-attr="aria-label:html.loading.progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="load-fill"></div>
            <div id="load-beans" aria-hidden="true"></div>
            <div id="load-runner" class="ld-runner" aria-hidden="true"><i class="ld-shadow"></i><i class="ld-sprite"></i></div>
          </div>
        </div>
        <div class="ld-meta"><small id="load-status" role="status" data-i18n="html.loading.status">Chuẩn bị thế giới</small><strong id="load-pct" aria-hidden="true">0%</strong></div>
      </div>
      <p id="load-tip" class="loading-tip"></p>
    </section>
    <section id="selection" hidden aria-label="Chọn nhân vật" data-i18n-attr="aria-label:html.selection.label">
      <h2 class="sel-title" data-i18n="html.selection.title">Choose your hero</h2>
      <span id="sel-plate" class="sel-plate"></span>
      <div class="selection-focus">
        <button type="button" class="selection-arrow selection-arrow--prev ui-btn ui-btn--icon" aria-label="Nhân vật trước" data-i18n-attr="aria-label:html.selection.prev">‹</button>
        <button type="button" class="selection-arrow selection-arrow--next ui-btn ui-btn--icon" aria-label="Nhân vật sau" data-i18n-attr="aria-label:html.selection.next">›</button>
        <span class="selection-check" aria-hidden="true">✓</span>
      </div>
      <form id="player-form" class="creation-card">
        <button id="enter-game" type="submit" class="ui-btn ui-btn--lg"><span data-i18n="html.selection.enter">Vào Game</span> <span aria-hidden="true">▶</span></button>
        <span class="tap-hand" aria-hidden="true">👆</span>
      </form>
    </section>
    <div id="scene-transition" aria-hidden="true"><div class="slide-sheet slide-left"></div><div class="slide-sheet slide-right"></div></div>
    <nav id="intro-controls" hidden aria-label="Điều khiển đoạn mở đầu" data-i18n-attr="aria-label:html.intro.controls">
      <div class="intro-actions">
        <button id="skip" class="ui-btn ui-btn--plain ui-btn--sm" type="button"><span data-i18n="html.intro.skip">Bỏ qua</span> <span aria-hidden="true">↗</span></button>
      </div>
    </nav>
    <section id="caption-box" class="dialogue" hidden aria-label="Hội thoại" data-i18n-attr="aria-label:html.dialogue.label">
      <div id="dialogue-avatar" class="dialogue-avatar" aria-hidden="true"></div>
      <div class="dialogue-body">
        <div class="dialogue-heading"><p id="speaker"></p><span class="dialogue-auto" data-i18n="html.dialogue.auto">TỰ ĐỘNG</span></div>
        <p id="caption" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="dialogue-tip" class="dialogue-tip" hidden role="status"></p>
        <div id="heaven-stamp" hidden role="status"></div>
        <div id="dialogue-choices" hidden aria-label="Các lựa chọn" data-i18n-attr="aria-label:html.dialogue.choices"></div>
        <div class="dialogue-bottom"><span class="dialogue-hint" data-i18n="dialogue.pressToContinue">Enter hoặc bấm để tiếp</span><button id="dialogue-next" class="ui-btn ui-btn--icon" type="button" aria-label="Tiếp hội thoại" title="Tiếp hội thoại" data-i18n-attr="aria-label:html.dialogue.next;title:html.dialogue.next">▾</button></div>
      </div>
    </section>
    <button id="game-settings-toggle" class="ui-btn ui-btn--icon" type="button" aria-label="Cài đặt âm thanh và đồ họa" title="Cài đặt" data-i18n-attr="aria-label:html.settings.label;title:settings.title" aria-haspopup="dialog"><span aria-hidden="true">⚙️</span></button>
    <div id="progress" hidden><div id="progress-fill"></div></div>
    <div id="error" class="ui-panel" role="alert" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
