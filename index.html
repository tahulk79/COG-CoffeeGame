<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#fff4e0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>COG-CoffeeGame</title>
    <!-- Game font (rounded, full Vietnamese support). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet" />
    <style>
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
      html, body { margin: 0; height: 100%; background: #fff4e0; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* dvh follows the visible viewport on phones (address bar shown/hidden); vh is the fallback. */
      canvas { display: block; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      /* Loading: plain HTML (shows before any script has loaded), the hero running on the spot and a bar. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff4e0; z-index: 10; transition: opacity .35s ease; font-family: 'Baloo 2', system-ui, sans-serif; color: #4a3428; }
      #boot.done { opacity: 0; pointer-events: none; }
      /* The run cycle moves the sprite sheet by transform (not background-position), so it keeps running while the world is being built. */
      #boot .runner { position: relative; width: 96px; height: 96px; overflow: hidden; animation: bob .25s ease-in-out infinite alternate; }
      #boot .runner::before { content: ''; position: absolute; left: 0; top: 0; width: 400%; height: 400%; background: url('/assets/slice/chapter1/hero-v1.webp') 0 0 / 100% 100% no-repeat; animation: run .5s steps(4) infinite; will-change: transform; }
      #boot .ground { width: 120px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, #d9c7a3 0 14px, transparent 14px 24px); animation: road .4s linear infinite; margin-top: -10px; }
      #boot .bar { width: min(260px, 60vw); height: 12px; border: 3px solid #4a3428; border-radius: 9px; background: #fffaf0; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 8%; background: #ff8a73; border-radius: 6px; transition: width .2s ease; }
      #boot .label { font-weight: 800; font-size: 18px; }
      @keyframes run { to { transform: translateX(-100%); } }
      @keyframes bob { to { transform: translateY(-3px); } }
      @keyframes road { to { background-position-x: -24px; } }
      @media (prefers-reduced-motion: reduce) { #boot .runner, #boot .runner::before, #boot .ground { animation: none; } }
      /* Chapter 2 is not in this build: a "coming soon" card over the world. */
      #soon { position: fixed; inset: 0; z-index: 11; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255, 244, 224, .92); font-family: 'Baloo 2', system-ui, sans-serif; color: #4a3428; }
      #soon .card { max-width: 360px; width: 100%; text-align: center; background: #fffaf0; border: 3.5px solid #4a3428; border-radius: 18px; padding: 22px 20px 20px; box-shadow: 0 6px 0 rgba(74, 52, 40, .18); }
      #soon .kicker { color: #ff8a73; font-weight: 800; font-size: 14px; letter-spacing: .04em; }
      #soon .title { font-weight: 800; font-size: 34px; line-height: 1.1; margin: 4px 0 8px; }
      #soon p { margin: 0 0 16px; font-size: 16px; }
      #soon button { font: inherit; font-weight: 800; font-size: 17px; color: #fff; background: #ff8a73; border: 3px solid #4a3428; border-radius: 12px; padding: 10px 18px; cursor: pointer; min-height: 44px; }
      #soon button:focus-visible { outline: 3px solid #4a3428; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="runner" aria-hidden="true"></div>
      <div class="ground" aria-hidden="true"></div>
      <div class="label">Đang tải…</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
